series:
  status: THIRD STAGE

prototype:
  bill:
    key: broadcasting
    formal_title: Broadcasting (Amendment) Bill 2026
    bill_number: 54/2026
    house: Dáil Éireann
    committee_date: 22 September 2026
    committee: Select Committee on Arts, Media, Communications, Culture and Sport
    what: "Reforms transparency, governance, performance assessment and funding arrangements for RTÉ and TG4, and changes parts of media regulation and public-service-content funding."
    happened: "The select committee examined the Bill section by section on 22 September. Amendments were agreed, withdrawn, lost and ruled out of order, and the Bill was reported with amendments."
    amendments: "Examples include a Government amendment to section 13 that was agreed, several opposition amendments that were withdrawn after debate, and amendments on audience-council arrangements that were lost. One amendment was put to a recorded division and lost 4 Tá to 5 Níl."
    effect: "The committee-stage changes are incorporated into the amended Bill text. This does not mean the Bill has become law, and the recorded division was on an amendment rather than the Bill as a whole."
    where: "The Bill remains before Dáil Éireann after Committee Stage. The normal next step is Report Stage, where amendments arising from Committee Stage can be considered."
    sources:
      - "Houses of the Oireachtas Bill 54 of 2026"
      - "Houses of the Oireachtas Committee Stage debate, 22 September 2026"
      - "Houses of the Oireachtas recorded division, 22 September 2026"
      - "Official explanatory memorandum"
