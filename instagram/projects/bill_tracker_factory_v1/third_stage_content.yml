prototype:
  bill:
    key: broadcasting
    formal_title: Broadcasting (Amendment) Bill 2026
    bill_number: 54/2026
    house: Dáil Éireann
    committee_date: 22 September 2026
    committee: Select Committee on Arts, Media, Communications, Culture and Sport
    what: "Reforms governance, transparency, performance assessment and funding for RTÉ and TG4, alongside changes to media regulation and public-service-content funding."
    happened: "A select committee examined the Bill section by section on 22 September. Amendments were agreed, withdrawn, lost and ruled out of order. The Bill was reported with amendments."
    amendments: "A Government amendment to section 13 was agreed. Several opposition amendments were withdrawn after debate, while others were lost. One amendment was decided by recorded division, 4 Tá to 5 Níl."
    effect: "Agreed amendments are now part of the amended Bill text. The Bill is not yet law, and the recorded division concerned an amendment, not approval of the Bill as a whole."
    where: "The Bill remains before Dáil Éireann after Committee Stage. The normal next step is Report Stage, when amendments arising from Committee Stage can be considered."
