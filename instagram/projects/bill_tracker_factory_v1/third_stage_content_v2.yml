  slapp:
    formal_title: Strategic Lawsuits against Public Participation Bill 2026
    bill_number: 76/2026
    house: Dáil Éireann
    stage_date: 29 September 2026
    hero: "THE BILL HAS MOVED TO DETAILED REVIEW, BUT NO OUTCOME IS PUBLISHED YET"
    what_bullets:
      - "Aims to protect people and groups from lawsuits used to discourage them from speaking out on public issues."
      - "Covers certain civil and commercial cases outside defamation cases."
      - "Brings Irish law into line with EU rules aimed at these types of lawsuits."
    status_bullets:
      - "The Dáil finished its broad debate on 29 September and sent the Bill for detailed review."
      - "That detailed review was scheduled for 1 October."
      - "As of 10 October, the official debate record did not show what happened at that review."
    watch_bullets:
      - "What changes TDs propose."
      - "Which proposed changes are accepted or rejected."
      - "Whether the Bill moves forward with changed wording."
    takeaway: "The Bill is at Third Stage, but there is not yet a published record showing whether its wording changed."
