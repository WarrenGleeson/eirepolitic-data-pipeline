mockups:
  broadcasting:
    formal_title: Broadcasting (Amendment) Bill 2026
    bill_number: 54/2026
    house: Dáil Éireann
    committee_date: 22 September 2026
    hero: "TDS CHANGED THE BILL DURING THIRD STAGE"
    result: "The Bill moved forward with changes"
    what_bullets:
      - "Changes how RTÉ and TG4 are overseen and how open they must be about decisions."
      - "Changes how their performance is reviewed and how some funding works."
      - "Changes some rules for media regulation and public-service content."
    third_stage_bullets:
      - "TDs went through the Bill section by section on 22 September."
      - "They proposed changes to the wording. Some were accepted, some were dropped, some were voted down, and one could not be considered."
      - "The accepted changes are now part of the updated Bill."
    next_stage: "REPORT STAGE"
    next_text: "TDs get another chance to review and propose changes before the final Dáil stage."
    why_stage: "Third Stage matters because this is where TDs can change the actual wording of a Bill, not just debate the idea behind it."
    amendment_examples:
      - number: "1"
        status: "COULD NOT PROCEED"
        title: "Extra State cost"
        detail: "The chair ruled that this proposed change would create a new cost for the State, so it could not be considered."
      - number: "9"
        status: "ACCEPTED"
        title: "Levy rules"
        detail: "A Government proposal changing the levy rules in section 13 was accepted."
      - number: "12"
        status: "WITHDRAWN"
        title: "Support for local music"
        detail: "The proposal was discussed and then withdrawn, so no final decision was taken on it."
    division:
      status: "PROPOSED CHANGE REJECTED"
      tally: "4 TÁ   5 NÍL"
      detail: "The committee voted 5 to 4 against one proposed change. This was not a vote on the Bill as a whole."

