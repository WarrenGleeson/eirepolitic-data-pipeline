# director/projects.yml — content-series catalogue.
#
# The `directory_listing` block below is AUTO-GENERATED by
# process/build_director_catalogue.py from `instagram/projects/*/project.yml`
# on `main` and drift-checked in CI — do not hand-edit it; regenerate it.
# The `notes` block per project is hand-maintained.

# AUTO-GENERATED — do not hand-edit below this line until the matching END marker.
directory_listing:
  generated_from: instagram/projects/*/project.yml on main
  generated_at_last_hand_sync: "2026-10-19"
  projects:
    - project_id: bill_tracker_factory_v1
      path: instagram/projects/bill_tracker_factory_v1/
      cadence: post1
      adapter_module: instagram.projects.bill_tracker_factory_v1.adapter
    - project_id: ipi_polling_factory_v1
      path: instagram/projects/ipi_polling_factory_v1/
      cadence: latest
      adapter_module: instagram.projects.ipi_polling_factory_v1.adapter
    - project_id: party_issue_monthly_profile_v2
      path: instagram/projects/party_issue_monthly_profile_v2/
      status_field_in_project_yml: approved
      cadence: monthly
      adapter_module: instagram.projects.party_issue_monthly_profile_v2.adapter_top_issue
# END AUTO-GENERATED

notes:
  bill_tracker_factory_v1:
    purpose: Reusable Bill Tracker carousel for Bills of the Current Session, including explainer, exact recorded-division, procedure and glossary slides.
    cadence_note: >
      The period values are post identifiers rather than a time cadence. The
      promoted project currently supports post1 and post2, each as a separate
      nine-slide publication artifact.
    ref_state: see refs.yml (merged via PR #177; supersedes stale PR #130 and draft PR #173)
    source: validated Oireachtas production pointer plus official Oireachtas proposition records and relevant official departmental material
    required_tables: [silver_member_votes, silver_member_memberships, silver_member_parties]
    expected_bill_count: 3
    expected_slide_count: 9
    render: {width: 1080, height: 1350}
    qa_declared_in_project_yml: {expected_slide_count: 9, expected_dimensions: [1080, 1350], require_publication_disabled: true, require_review_state: pending_human_review, require_source_footer: true}
    publication_enabled: false
    publishing_allowed: false
    canonical_visual_reference: see references.yml (bill_tracker_series.canonical_visual_reference)
    completed_posts: [2026-10-02-bill-tracker-enacted-post1, 2026-10-03-bill-tracker-enacted-post2]

  party_issue_monthly_profile_v2:
    purpose: Reusable monthly Party Speech Breakdown carousel using classified Dáil speeches.
    ref_state: see refs.yml (merged, depends_on corner_assets_pinned)
    source: oireachtas_unified pointer, requires validated immutable batch, requires issue-classification gate
    required_tables: [silver_speeches, enrichment_speech_issue_labels, silver_member_memberships, silver_member_parties, silver_member_constituencies]
    slides_per_party: 5
    expected_party_count: 11
    expected_slide_count: 55
    render: {width: 1080, height: 1350, renderer: instagram.visuals.renderers.horizontal_bar, outer_layout: instagram/templates/layouts/title_text_media_v1.json}
    qa_declared_in_project_yml: {require_no_text_clipping: true, require_no_text_truncation: true, require_glossary: true, require_asset_registry: configs/reference/party_assets_v1.csv, require_publication_disabled: true, require_review_state: pending_human_review}
    output_s3_prefix: processed/instagram/party_issue_monthly_profile_v2/period=<YYYY-MM>/source_batch=<batch>/github_run=<run_id>/
    publication_enabled: false
    canonical_visual_reference: 2026-07 — see references.yml for the full record and rationale.

  ipi_polling_factory_v1:
    purpose: Raw-polling-data Instagram carousel (latest support, change since previous poll, six-month trend, methodology).
    cadence_note: >
      project.yml's period.default is literally "latest" (see
      directory_listing above) — there is no fixed monthly cadence like
      party_issue_monthly_profile_v2; this project is dispatched on-demand
      against whatever the current polling data supports.
    ref_state: see refs.yml (merged, on main independent of Phase 1 promotion)
    source: s3://eirepolitic-data/processed/polling/irish_polling_indicator/latest/csv/polls.csv (Irish Polling Indicator raw polls)
    slides: [latest_support, change_since_previous_poll, recent_trend, methodology]
    render: {width: 1080, height: 1350, renderers: [horizontal_bar, diverging_bar, line_trend, glossary_methodology]}
    qa_declared_in_project_yml: {expected_slide_count: 4, expected_dimensions: [1080, 1350], require_source_footer: true}
    publication_enabled: false
    workflows: [instagram_polling_factory_render.yml, instagram_polling_factory_ci.yml]
    archived_reference: 2026-09-06-ipi-polling-carousel (the one entry in the completed-post archive as of Phase 0/1/2 — see references.yml)
