    38 workflows added to this inventory on 2026-09-17 when a
    `list_workflows` MCP-tool pagination bug was found and fixed (the tool
    silently caps results at 100 without auto-paginating; this file's
    inventory had been built from an incomplete ~100-workflow snapshot
    since Phase 2's first draft — see refs.yml and the Phase 2 PR history
    for the full account). None of these are individually investigated;
    they are grouped here by naming pattern only, same discipline as the
    other coarse buckets above. party_assets_audit.yml,
    party_assets_publication_review.yml, party_assets_review.yml — likely
    join party_logo_reviews in scope (party asset registry QA) but not
    confirmed. sinn_fein_exhaustive_review.yml,
    social_democrats_boxed_logo.yml, social_democrats_exhaustive_review.yml
    — likely join party_logo_reviews (per-party logo QA, same pattern as
    fianna_fail_exhaustive_review.yml / fine_gael_color_review.yml).
    instagram_option5_constituency_cover_ai.yml,
    instagram_option5_member_profile_ai.yml — likely join
    instagram_experimental_manual_tests (Option 5 AI-visuals experiments,
