      `directory_listing` block) from a live GitHub Actions/projects.yml
      read via process/build_director_catalogue.py --check, and fails CI on
      drift. Triggers on push/PR to director/workflows.yml,
      director/projects.yml, instagram/projects/**/project.yml,
      .github/workflows/**, and process/build_director_catalogue.py, plus a
      daily cron.
    status: active, current, required
    ref_state: main (added Phase 2)

  instagram_factory_render.yml:
    purpose: >
      Generic, project-agnostic render workflow (plan §3.4) — dispatches
      instagram.factory.render_pipeline.run_and_normalize() against any
      project_id, running it through the shared contract.py/normalize.py/
      qa.py, building the review page via review_page.py, and force-pushing
      previews/<slug>. Replaces the need for a new bespoke ~200-line
      workflow per content product. Worktree-pins to 386b933 for the
      corner-asset binaries per the corner_assets_pinned constraint (§1.8),
      same as instagram_polling_factory_render.yml.
    status: active, current, production (Phase 3, added 2026-09-20)
    ref_state: main (Batch 1, pushed by Warren — plan §1.13)
    verified_by: >
      Three live dispatches 2026-09-20 (party_issue_monthly_profile_v2 x2 —
      default period 2026-08 and an explicit 2026-07 regression check —
      plus ipi_polling_factory_v1 default period): all conclusion=success,
      all declarative QA checks PASS. See plan §1.13 and the session record
      director/sessions/2026-09-20-phase3-close-out/.

  instagram_polling_factory_render.yml:
    purpose: Production render for ipi_polling_factory_v1 — worktree-pins its assets, builds review page, force-pushes previews/ipi-polling-factory.
    status: active, current, production
    superseded_by: >
      instagram_factory_render.yml (Phase 3, 2026-09-20). Kept live per
      plan §3.4 ("existing per-project workflows are kept"); new renders
      for this project should prefer the generic workflow going forward.
  instagram_polling_factory_ci.yml:
    purpose: CI for the polling factory project.
    status: active, current, production

  instagram_polling_snapshot_render.yml:
    purpose: Not investigated this phase — name suggests a polling-snapshot render distinct from instagram_polling_factory_render.yml. Relationship (parallel product vs. superseded) unconfirmed.
    status: needs_review
  instagram_polling_snapshot_ci.yml:
    purpose: CI counterpart to instagram_polling_snapshot_render.yml. Not investigated this phase.
    status: needs_review

  instagram_publishing_foundation_ci.yml:
    purpose: CI for the publishing-stack work (refs.yml publishing_stack). Not investigated this phase — confirm scope before relying on this note.
    status: needs_review

  instagram_source_attribution_ci.yml:
    purpose: CI for source-attribution correctness (plan §9 "what will not be rebuilt" — attribution.py). Not investigated this phase.
    status: needs_review

  completed_post_archive.yml:
    purpose: Generic S3 archive-write for a completed post; reads assets from a git ref, not S3. See capabilities.yml completed_post_archive and references.yml for the current gap (party July render assets live in S3, not on a git ref).
    status: active, current, production
  completed_post_archive_ci.yml:
    purpose: Unit tests tools/completed_post_archive.py and validates the committed summary shape against the one existing git-tracked summary.
    status: active, current, production
  completed_post_reference.yml:
    purpose: Read-only — fetches and prints index.json, optionally downloads one post's full archive folder as a workflow artifact.
    status: active, current, production
  completed_post_seed_20260906_polling.yml:
    purpose: One-off seed instance of completed_post_archive.yml, hardcoded to the 2026-09-06 polling post, assets sourced from previews/ipi-polling-factory branch.
    status: disabled_manually (per live inventory) — historical, do not re-enable casually; it is a one-off, not a template to copy verbatim (its assets-from-git-branch approach doesn't apply to the party project's S3-only assets).
  completed_post_overlord_initialize.yml:
    purpose: One-time initializer for the separate "overlord" S3 index namespace (instagram/previews/completed-posts/overlord/index.json). Not the same catalogue as the eirepolitic-data-pipeline namespace.
    status: active, current, utility

  instagram_factory_generic_validate.yml:
  # and the sibling instagram_factory_generic_plan_update.yml,
  # instagram_factory_phase1_plan_update.yml,
  # instagram_factory_phase2_plan_update.yml/_quality_patch.yml,
  # instagram_factory_party_project.yml,
  # instagram_factory_horizontal_profile_update.yml,
  # instagram_factory_real_data_policy_update.yml,
  # instagram_factory_text_*.yml, instagram_factory_validate.yml,
  # instagram_factory_validation_plan_status_update.yml,
  # instagram_factory_visual_validation_plan_update.yml
    purpose: >
      This whole family looks like the historical build/validation trail
      for the factory work that eventually became the Phase 1 promotion
      (commit 386b933 and its lineage on the unmerged
      feature/instagram-monthly-post-framework branch). Not individually
      investigated this phase. Likely historical/superseded now that the
      factory is merged and CI-guarded on main — a future session should
      confirm and mark them explicitly `superseded_by:
      director_factory_v1_identity_ci.yml` (or disable them) rather than
      leaving them as live, undifferentiated entries in the raw inventory.
    status: needs_review

  _promote_instagram_framework.yml:
    purpose: Not investigated this phase. Name suggests an earlier promotion mechanism/attempt — possibly a predecessor to or overlapping with the Phase 1 promotion done via PR #143 (which went through the Sly_Director_GitHub MCP path, not this workflow). Needs reconciliation before being treated as current.
    status: needs_review

category_buckets:
  # Coarse, name-prefix-based grouping for orientation only — not a claim
  # about each workflow's actual current purpose. See `annotated` above for
  # anything the Director should treat as verified.
  oireachtas_data_pipeline_historical: >
    64 workflows prefixed oireachtas_ — batch/checkpoint/compat-adapter/
    diagnostic/patch/validation runs from the Oireachtas data-pipeline
    build-out. oireachtas_monthly_refresh.yml is the recurring production
    job (see refs.yml oireachtas_data_pipeline); the rest read as
    development-history diagnostics, not investigated individually. Count
    corrected 2026-09-17 (was "~60") once the `list_workflows` pagination
    bug below was fixed and the full set became visible.
  instagram_factory_build_trail: See annotated.instagram_factory_generic_validate.yml above.
  instagram_experimental_manual_tests: >
    instagram_campaign_render.yml, instagram_constituency_test.yml,
    instagram_media_test.yml, instagram_option5_*.yml,
    instagram_s3_preview_test.yml, instagram_template_render_test.yml,
    instagram_template_test.yml — manual/on-demand test workflows for the
    superseded Bannerbear/Placid pipeline and the Option 5 AI-visuals
    experiments. See refs.yml bannerbear_placid_template_pipeline and
    option5_ai_visuals.
  temporary_bounded_validations: >
    cso-pxstat-bounded-validation.yml, demographic-polling-bounded-
    validation.yml, election-count-bounded-validation.yml, ipi-bounded-
    validation.yml, official-recurring-data-bounded-validation.yml,
