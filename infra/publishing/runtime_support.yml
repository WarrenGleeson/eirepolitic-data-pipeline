AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Runtime support for Eirepolitic Instagram publishing. Creates the private
  approved-assets bucket, attaches runtime permissions to the existing publisher
  Lambda role, adds Lambda error monitoring, and permits SES to store inbound
  approval replies under a dedicated short-retention prefix.

Parameters:
  PublisherFunctionName:
    Type: String
    Default: eirepolitic-instagram-publisher
  PublisherExecutionRoleName:
    Type: String
    Default: eirepolitic-instagram-publisher-role-tr4na73j
  PublicationTableName:
    Type: String
    Default: eirepolitic-publications
  ScheduleGroupName:
    Type: String
    Default: eirepolitic-instagram

Resources:
  ApprovedAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub eirepolitic-instagram-approved-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInboundApprovalEmails
            Status: Enabled
            Prefix: inbound-approvals/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: application
          Value: eirepolitic-instagram-publishing
        - Key: component
          Value: approved-assets

  ApprovedAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ApprovedAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ApprovedAssetsBucket.Arn
              - !Sub ${ApprovedAssetsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowSesInboundApprovalEmail
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${ApprovedAssetsBucket.Arn}/inbound-approvals/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  PublisherRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EirepoliticInstagramPublisherRuntime
      Roles:
        - !Ref PublisherExecutionRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadApprovedPublishingAssets
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${ApprovedAssetsBucket.Arn}/instagram/approved/*
          - Sid: ReadWritePublicationLedger
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PublicationTableName}
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PublicationTableName}/index/*
          - Sid: ManagePublicationSchedules
            Effect: Allow
            Action:
              - scheduler:CreateSchedule
              - scheduler:GetSchedule
              - scheduler:UpdateSchedule
              - scheduler:DeleteSchedule
            Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ScheduleGroupName}/*
          - Sid: PassSchedulerExecutionRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eirepolitic-instagram-scheduler-execution
            Condition:
              StringEquals:
                iam:PassedToService: scheduler.amazonaws.com

  PublisherLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: eirepolitic-instagram-publisher-errors
      AlarmDescription: Detects errors returned by the Instagram publisher Lambda.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PublisherFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApprovedAssetsBucketName:
    Description: Private versioned bucket for immutable approved Instagram media and inbound approval replies.
    Value: !Ref ApprovedAssetsBucket
  ApprovedAssetsPrefix:
    Description: Required immutable approved-media prefix.
    Value: instagram/approved/
  InboundApprovalPrefix:
    Description: SES-only short-retention prefix for raw approval replies.
    Value: inbound-approvals/
  PublisherRuntimePolicyName:
    Description: Inline runtime policy attached to the existing publisher role.
    Value: !Ref PublisherRuntimePolicy
