name: Instagram schedule inventory

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: us-east-2

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Assume High Director AWS administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role \
            --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" \
            --role-session-name instagram-schedule-inventory-${GITHUB_RUN_ID} \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"

      - name: Build Director Instagram schedule and caption snapshot
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          mkdir -p director/sessions/2026-09-27-recorded-voting-participation/publishing_review
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import boto3

          table = boto3.resource('dynamodb', region_name='us-east-2').Table('eirepolitic-publications')
          items = []
          kwargs = {}
          while True:
              response = table.scan(**kwargs)
              items.extend(response.get('Items', []))
              key = response.get('LastEvaluatedKey')
              if not key:
                  break
              kwargs['ExclusiveStartKey'] = key

          rows = []
          for item in items:
              if item.get('entity_type') != 'publication_control':
                  continue
              request = item.get('request') or {}
              schedule = item.get('schedule') or {}
              scheduled_at = item.get('scheduled_at_utc') or schedule.get('scheduled_at_utc')
              if not scheduled_at:
                  continue
              rows.append({
                  'publication_id': item.get('publication_id'),
                  'project_id': request.get('project_id'),
                  'state': item.get('state'),
                  'scheduled_local': schedule.get('scheduled_local'),
                  'timezone': schedule.get('timezone'),
                  'scheduled_at_utc': scheduled_at,
                  'caption': request.get('caption', ''),
                  'hashtags': request.get('hashtags', []),
                  'post_type': (request.get('instagram') or {}).get('post_type'),
              })

          rows.sort(key=lambda row: row['scheduled_at_utc'])
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          upcoming = [row for row in rows if row['scheduled_at_utc'] >= now]
          recent = [row for row in rows if row['scheduled_at_utc'] < now][-8:]
          snapshot = {
              'generated_at_utc': now,
              'recent_scheduled_or_published': recent,
              'upcoming': upcoming,
          }
          out = 'director/sessions/2026-09-27-recorded-voting-participation/publishing_review/instagram_schedule_caption_snapshot.json'
          with open(out, 'w', encoding='utf-8') as handle:
              json.dump(snapshot, handle, indent=2, ensure_ascii=False)
              handle.write('\n')
          print(json.dumps(snapshot, indent=2, ensure_ascii=False))
          PY

      - name: Persist Director review snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add director/sessions/2026-09-27-recorded-voting-participation/publishing_review/instagram_schedule_caption_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Instagram schedule and caption review snapshot"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
