name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  AWS_REGION: us-east-2
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    outputs:
      match: ${{ steps.probe.outputs.match }}
      runtime: ${{ steps.probe.outputs.runtime }}
      http: ${{ steps.probe.outputs.http }}
      deploy: ${{ steps.probe.outputs.deploy }}
      environment: ${{ steps.probe.outputs.environment }}
      source: ${{ steps.probe.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing High Director AWS administrator role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role \
            --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" \
            --role-session-name high-director-lambda-readonly-inventory-${GITHUB_RUN_ID} \
            --duration-seconds 900 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - id: probe
        name: Inspect live deployment and entrypoint without returning source, secrets, or URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,io,os,urllib.request,zipfile
          import boto3
          client=boto3.client('lambda',region_name='us-east-2')
          target='github-gpt-wrapper-GithubGptWrapperRole-6j2drFhUXMyo'
          matches=[f for page in client.get_paginator('list_functions').paginate() for f in page.get('Functions',[]) if f.get('Role','').split('/')[-1]==target]
          def clean(x): return str(x if x is not None else 'unknown').replace('\n',' ').replace('\r',' ')[:180]
          result={'match': f'count={len(matches)}'}
          if len(matches)==1:
              f=matches[0]; name=f['FunctionName']; config=client.get_function_configuration(FunctionName=name)
              result['match']=f'count=1 name={name}'
              result['runtime']=f"runtime={config.get('Runtime')} handler={config.get('Handler')} architecture={','.join(config.get('Architectures',[]))} package={config.get('PackageType')}"
              result['deploy']=f"memory={config.get('MemorySize')} timeout={config.get('Timeout')} state={config.get('State')} update={config.get('LastUpdateStatus')} version={config.get('Version')}"
              try:
                  u=client.get_function_url_config(FunctionName=name)
                  result['http']=f"url=yes auth={u.get('AuthType')} mode={u.get('InvokeMode')} cors={bool(u.get('Cors'))}"
              except client.exceptions.ResourceNotFoundException:
                  result['http']='url=no'
              aliases=client.list_aliases(FunctionName=name).get('Aliases',[])
              versions=client.list_versions_by_function(FunctionName=name).get('Versions',[])
              result['environment']=f"env_keys={','.join(sorted(config.get('Environment',{}).get('Variables',{})))} aliases={','.join(a['Name'] for a in aliases) or 'none'} versions={len(versions)}"
              try:
                  code=client.get_function(FunctionName=name)['Code']
                  with urllib.request.urlopen(code['Location'],timeout=25) as response:
                      package=response.read(30_000_000)
                  with zipfile.ZipFile(io.BytesIO(package)) as archive:
                      files=set(archive.namelist())
                      entry='src/app.py'
                      if entry in files:
                          module=ast.parse(archive.read(entry).decode('utf-8-sig'))
                          routes=sum(isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and any(isinstance(d,ast.Call) and isinstance(d.func,ast.Attribute) and d.func.attr in ('get','post','put','patch','delete') for d in node.decorator_list) for node in ast.walk(module))
                          imports=sorted({n.names[0].name.split('.')[0] for n in ast.walk(module) if isinstance(n,ast.Import) for _ in [0]} | {n.module.split('.')[0] for n in ast.walk(module) if isinstance(n,ast.ImportFrom) and n.module})
                          result['source']=f'app_py=yes routes={routes} mangum={"mangum" in imports} fastapi={"fastapi" in imports} files={len(files)}'
                      else:
                          result['source']=f'app_py=no files={len(files)}'
              except Exception as exc:
                  result['source']='inspect_failed='+type(exc).__name__
          for key in ('match','runtime','http','deploy','environment','source'):
              result.setdefault(key,'unavailable')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,item in result.items(): output.write(key+'='+clean(item)+'\n')
          print('Read-only AWS and source structure inventory complete. No code, URL, secrets or environment values emitted.')
          PY
  identity:
    needs: inventory
    runs-on: ubuntu-latest
    name: 'Live function: ${{ needs.inventory.outputs.match }}'
    steps:
      - run: 'true'
  runtime:
    needs: inventory
    runs-on: ubuntu-latest
    name: 'Live runtime: ${{ needs.inventory.outputs.runtime }}'
    steps:
      - run: 'true'
  url:
    needs: inventory
    runs-on: ubuntu-latest
    name: 'Live HTTP: ${{ needs.inventory.outputs.http }}'
    steps:
      - run: 'true'
  deployment:
    needs: inventory
    runs-on: ubuntu-latest
    name: 'Live deployment: ${{ needs.inventory.outputs.deploy }}'
    steps:
      - run: 'true'
  variables:
    needs: inventory
    runs-on: ubuntu-latest
    name: 'Live metadata: ${{ needs.inventory.outputs.environment }}'
    steps:
      - run: 'true'
  source:
    needs: inventory
    runs-on: ubuntu-latest
    name: 'Live source: ${{ needs.inventory.outputs.source }}'
    steps:
      - run: 'true'
