name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        name: Check public MCP and Auth0 discovery metadata without credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          mcp='https://z2yacqwhvykeh32xasdps5jwdm0nzmqh.lambda-url.us-east-2.on.aws'
          expected_issuer='https://dev-b0akjdvpjmc382zz.us.auth0.com/'
          expected_resource=mcp+'/director/mcp'
          def get(url):
              try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'HighDirectorMetadataAudit/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      return response.status,json.load(response),dict(response.headers)
              except urllib.error.HTTPError as exc:
                  return exc.code,{},dict(exc.headers)
          mcpstatus,resource,_=get(mcp+'/.well-known/oauth-protected-resource/director/mcp')
          rootstatus,root,_=get(mcp+'/.well-known/oauth-protected-resource')
          authstatus,auth,_=get(expected_issuer+'.well-known/oauth-authorization-server')
          oidcstatus,oidc,_=get(expected_issuer+'.well-known/openid-configuration')
          provider=auth if authstatus==200 else oidc if oidcstatus==200 else {}
          challenges=[]
          try:
              req=urllib.request.Request(mcp+'/director/mcp',data=json.dumps({'jsonrpc':'2.0','id':1,'method':'tools/list'}).encode(),method='POST',headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'})
              urllib.request.urlopen(req,timeout=15)
              challenges.append('MCP unexpected anonymous 200')
          except urllib.error.HTTPError as exc:
              challenges.append('MCP anonymous '+str(exc.code))
              challenges.append('WWW-Authenticate '+str(exc.headers.get('WWW-Authenticate','missing'))[:160])
          issuer_matches=(resource.get('authorization_servers')==[expected_issuer] and provider.get('issuer')==expected_issuer)
          resource_matches=(resource.get('resource')==expected_resource and root.get('resource')==expected_resource)
          pkce='S256' in provider.get('code_challenge_methods_supported',[])
          issuer_id=provider.get('authorization_response_iss_parameter_supported') is True
          dcr=bool(provider.get('registration_endpoint'))
          cimd=provider.get('client_id_metadata_document_supported') is True
          fields={'resource_status':mcpstatus,'root_status':rootstatus,'auth0_oauth_metadata_status':authstatus,'auth0_oidc_status':oidcstatus,'issuer_match':issuer_matches,'resource_match':resource_matches,'pkce_s256':pkce,'issuer_response_support':issuer_id,'registration_endpoint':dcr,'cimd':cimd,'token_auth_methods':provider.get('token_endpoint_auth_methods_supported',[]),'scopes_supported':provider.get('scopes_supported',[])[:20],'api_scopes':resource.get('scopes_supported',[]),'challenge':challenges}
          print('PUBLIC DISCOVERY DIAGNOSTIC (no secrets): '+json.dumps(fields,sort_keys=True))
          summary=f"mcp={mcpstatus}/{rootstatus} oidc={oidcstatus} issuer={int(issuer_matches)} resource={int(resource_matches)} pkce={int(pkce)} iss_callback={int(issuer_id)} dcr={int(dcr)} cimd={int(cimd)}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('result='+summary+'\n')
          if mcpstatus!=200 or rootstatus!=200 or not issuer_matches or not resource_matches:
              raise SystemExit('MCP OAuth discovery failed trust checks')
          PY
  report:
    needs: inspect
    if: always()
    runs-on: ubuntu-latest
    name: 'OAuth discovery: ${{ needs.inspect.outputs.result }}'
    steps:
      - run: 'true'
