name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 12
    outputs:
      diagnostic: ${{ steps.preflight.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing AWS administrator role for read-only audit
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name hd-mcp-readonly-${GITHUB_RUN_ID} --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - id: preflight
        name: Preflight production ZIP with MCP modules (NO AWS changes)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3 requests
          python - <<'PY'
          import os,re,subprocess,sys
          result=subprocess.run([sys.executable,'scripts/high_director_mcp_preflight.py'],capture_output=True,text=True,timeout=480)
          lines=(result.stderr+'\n'+result.stdout).splitlines()
          diagnostic='passed' if result.returncode==0 else 'unknown failure'
          if result.returncode:
              for line in reversed(lines):
                  if line.strip().startswith(('AssertionError:', 'ImportError:', 'ModuleNotFoundError:', 'RuntimeError:', 'TypeError:', 'ValueError:', 'NameError:', 'AttributeError:', 'KeyError:', 'PermissionError:', 'SyntaxError:')):
                      diagnostic=line.strip()
                      break
          diagnostic=re.sub(r'[^a-zA-Z0-9_:\./ ,=()-]','',diagnostic)[:160]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('diagnostic='+diagnostic+'\n')
          print('High Director MCP package preflight: '+diagnostic)
          if result.returncode:
              sys.exit(1)
          PY
  report:
    needs: inventory
    if: always()
    runs-on: ubuntu-latest
    name: 'MCP build: ${{ needs.inventory.outputs.diagnostic }}'
    steps:
      - run: 'true'
