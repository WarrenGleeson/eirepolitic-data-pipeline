name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing AWS role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name voting-slot-audit-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Read active DynamoDB controls and EventBridge schedules
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python - <<'PY'
          import json
          from datetime import date,datetime,timedelta,timezone
          from pathlib import Path
          import boto3
          from botocore.exceptions import ClientError
          ddb=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          eb=boto3.client('scheduler',region_name='us-east-2')
          records=[]; cursor={}
          while True:
              page=ddb.scan(**cursor)
              for row in page.get('Items',[]):
                  if row.get('entity_type')!='publication_control': continue
                  schedule=row.get('schedule') or {}
                  records.append({'id':str(row.get('publication_id','')),'project':str((row.get('request') or {}).get('project_id','')),'state':str(row.get('state','')),'time':str(row.get('scheduled_at_utc') or schedule.get('scheduled_at_utc') or '')})
              if not page.get('LastEvaluatedKey'): break
              cursor={'ExclusiveStartKey':page['LastEvaluatedKey']}
          schedules=[]; cursor={}
          while True:
              page=eb.list_schedules(GroupName='eirepolitic-instagram',**cursor)
              for row in page.get('Schedules',[]):
                  schedules.append({'name':row['Name'],'expression':row.get('ScheduleExpression',''),'state':row.get('State','')})
              if not page.get('NextToken'): break
              cursor={'NextToken':page['NextToken']}
          def parse(value):
              try:
                  parsed=datetime.fromisoformat(value.replace('Z','+00:00'))
                  return parsed.replace(tzinfo=timezone.utc) if parsed.tzinfo is None else parsed.astimezone(timezone.utc)
              except (ValueError,AttributeError): return None
          occupied={}
          for d in range(1,22):
              slot=(datetime.now(timezone.utc).date()+timedelta(days=d)).isoformat()+'T15:00:00'
              blockers=[]
              for row in records:
                  if row['state'] in ('cancelled','failed'): continue
                  parsed=parse(row['time'])
                  if parsed and parsed.strftime('%Y-%m-%dT%H:%M:%S')==slot: blockers.append('DDB:'+row['id']+':'+row['state'])
              for row in schedules:
                  if row['expression']==f'at({slot})' and row['state']!='DISABLED': blockers.append('EB:'+row['name'])
              occupied[slot+'Z']=blockers
          old=[]
          for key in ('tds','constituencies','parties'):
              ident=f'ig-rvp-{key}-20260406-20261006-20261020'
              old.append({'kind':key,'control':next((r for r in records if r['id']==ident),None),'eventbridge':next((s for s in schedules if s['name']==f'instagram-{ident}-v1'),None)})
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'group':'eirepolitic-instagram','old_posts':old,'slots_15utc':occupied,'active_schedule_count':len(schedules),'active_control_count':sum(r['state']=='scheduled' for r in records)}
          text=json.dumps(report,indent=2,ensure_ascii=False)
          out=Path('director/sessions/2026-09-27-recorded-voting-participation/publishing_review/next_slots_audit_20261025.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(text+'\n',encoding='utf-8')
          print(text)
          PY
      - name: Save audit to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-09-27-recorded-voting-participation/publishing_review/next_slots_audit_20261025.json
          git commit -m 'Record next open Instagram publication slots'
          git push origin HEAD:director/voting-ledger-audit-20261025
