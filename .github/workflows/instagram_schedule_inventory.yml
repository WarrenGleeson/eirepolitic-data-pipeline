name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing AWS role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name director-instagram-audit-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Inspect execution state and Lambda error metrics without writes
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python - <<'PY'
          import boto3,json
          from pathlib import Path
          from datetime import datetime,timezone
          from botocore.exceptions import ClientError
          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          logs=boto3.client('logs',region_name='us-east-2')
          result={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'publications':[],'logs':{}}
          for kind in ('tds','constituencies','parties'):
              pub=f'ig-rvp-{kind}-20260406-20261006-20261026'
              control=table.get_item(Key={'pk':f'PUB#{pub}','sk':'CONTROL'},ConsistentRead=True).get('Item',{})
              execution=table.get_item(Key={'pk':f'PUB#{pub}','sk':'EXEC#v00000001'},ConsistentRead=True).get('Item',{})
              attempt=execution.get('attempt') or {}
              ops=[]
              for op in attempt.get('operations',[]):
                  ops.append({key:str(op.get(key,''))[:200] for key in ('kind','operation_type','status','state','step','provider_id','created_at_utc','updated_at_utc','error_code','idempotency_key') if key in op})
              result['publications'].append({'kind':kind,'ledger_state':control.get('state'),'execution_state':attempt.get('state'),'published_media_id_present':bool(attempt.get('published_media_id')),'attempt_id':str(attempt.get('attempt_id','')),'lease_expires_at_utc':str(attempt.get('lease_expires_at_utc','')),'revision':str(execution.get('revision','')),'operation_count':len(attempt.get('operations',[])),'operations':ops})
          group='/aws/lambda/eirepolitic-instagram-publisher'
          from datetime import datetime,timezone
          start=int(datetime(2026,10,26,tzinfo=timezone.utc).timestamp()*1000)
          end=int(datetime(2026,10,30,tzinfo=timezone.utc).timestamp()*1000)
          try:
              response=logs.filter_log_events(logGroupName=group,startTime=start,endTime=end,limit=400)
              events=response.get('events',[])
              result['logs']['first_page_count']=len(events)
              result['logs']['has_next_page']=bool(response.get('nextToken'))
              # Only preserve signal keywords; do not store log messages.
              summaries=[]
              for ev in events:
                  msg=ev.get('message','')
                  kinds=[kind for kind in ('tds','constituencies','parties') if f'ig-rvp-{kind}-' in msg]
                  flags=[term for term in ('error','exception','failed','retry','published','attention','timeout','success','invalid','skip','rate limit') if term in msg.lower()]
                  if flags or kinds:
                      summaries.append({'time':datetime.fromtimestamp(ev['timestamp']/1000,timezone.utc).isoformat(),'kinds':kinds,'flags':flags,'message_type':msg.split(':',1)[0][:80]})
              result['logs']['event_summaries']=summaries[-120:]
          except ClientError as exc:
              result['logs']['error_code']=exc.response.get('Error',{}).get('Code')
              result['logs']['error_message']=str(exc.response.get('Error',{}).get('Message',''))[:350]
          output=Path('director/sessions/2026-09-27-recorded-voting-participation/publishing_review/posting_execution_audit_20261107.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(result,indent=2,default=str)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2,default=str))
          PY
      - name: Persist isolated audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-09-27-recorded-voting-participation/publishing_review/posting_execution_audit_20261107.json
          git commit -m 'Record read-only publication execution states'
          git push origin HEAD:director/audit-voting-posts-20261107
