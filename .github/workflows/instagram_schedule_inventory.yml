name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    outputs:
      source: ${{ steps.probe.outputs.source }}
      cognito: ${{ steps.probe.outputs.cognito }}
      config: ${{ steps.probe.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume established AWS administrator role for read-only calls
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name hd-source-compare-${GITHUB_RUN_ID} --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Read deployed source and available identity services (no changes)
        id: probe
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, io, os, urllib.request, zipfile
          import boto3
          region='us-east-2'; name='github-gpt-wrapper-GithubGptWrapper-SKhOCHfaqOtn'
          client=boto3.client('lambda',region_name=region)
          data=client.get_function(FunctionName=name)
          config=data['Configuration']
          with urllib.request.urlopen(data['Code']['Location'],timeout=30) as src:
              archive=zipfile.ZipFile(io.BytesIO(src.read(40_000_000)))
              current=archive.read('src/app.py')
              files=set(archive.namelist())
          root='https://raw.githubusercontent.com/warrengleeson/warrengleeson.github.io/main/assets/high-director/github-wrapper-source/src/'
          try:
              pieces=[]
              for i in range(1,5):
                  with urllib.request.urlopen(root+f'app.py.part{i:02d}',timeout=12) as remote:
                      pieces.append(remote.read())
              old=b''.join(pieces)
              source=f'bytes_equal={current==old} ast_equal={ast.dump(ast.parse(current))==ast.dump(ast.parse(old))} live_lines={len(current.splitlines())} old_lines={len(old.splitlines())} zip_files={len(files)}'
          except Exception as exc:
              source='comparison_unavailable='+type(exc).__name__
          cognito=boto3.client('cognito-idp',region_name=region)
          pools=[]; token=None
          while True:
              kwargs={'MaxResults':60}
              if token: kwargs['NextToken']=token
              r=cognito.list_user_pools(**kwargs)
              pools.extend(r.get('UserPools',[])); token=r.get('NextToken')
              if not token: break
          domains=0; clients=0
          for pool in pools:
              d=cognito.describe_user_pool(UserPoolId=pool['Id'])['UserPool']; domains+=int(bool(d.get('Domain') or d.get('CustomDomain')))
              clients+=len(cognito.list_user_pool_clients(UserPoolId=pool['Id'],MaxResults=60).get('UserPoolClients',[]))
          idp=f'user_pools={len(pools)} domains={domains} app_clients_at_least={clients}'
          baseline=f'handler={config.get("Handler")} runtime={config.get("Runtime")} code_size={config.get("CodeSize")} publish_version={config.get("Version")}'
          for field,value in [('source',source),('cognito',idp),('config',baseline)]:
              safe=str(value).replace('\n',' ').replace('\r',' ')[:185]
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(field+'='+safe+'\n')
          print('Only non-secret structural comparison and service counts produced.')
          PY
  source_result:
    needs: inspect
    runs-on: ubuntu-latest
    name: 'Source compare: ${{ needs.inspect.outputs.source }}'
    steps:
      - run: 'true'
  cognito_result:
    needs: inspect
    runs-on: ubuntu-latest
    name: 'Cognito availability: ${{ needs.inspect.outputs.cognito }}'
    steps:
      - run: 'true'
  deployment_result:
    needs: inspect
    runs-on: ubuntu-latest
    name: 'Lambda configuration: ${{ needs.inspect.outputs.config }}'
    steps:
      - run: 'true'
