name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing AWS role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name director-instagram-audit-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Read Meta container status and compare published account media
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import boto3,json
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib import parse,request,error
          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          secrets=boto3.client('secretsmanager',region_name='us-east-2')
          pub='ig-rvp-tds-20260406-20261006-20261026'
          item=table.get_item(Key={'pk':f'PUB#{pub}','sk':'EXEC#v00000001'},ConsistentRead=True)['Item']
          attempt=item['attempt']
          control=table.get_item(Key={'pk':f'PUB#{pub}','sk':'CONTROL'},ConsistentRead=True)['Item']
          operations=[{'key':op.get('operation_key'),'state':op.get('state'),'provider_id':op.get('provider_id')} for op in attempt.get('operations',[])]
          parent=next((op.get('provider_id') for op in attempt.get('operations',[]) if op.get('operation_key')=='create_parent'),None)
          publish=next((op for op in attempt.get('operations',[]) if op.get('operation_key')=='publish_parent'),None)
          if not parent or not publish or publish.get('state')!='uncertain':raise RuntimeError('TDs operation state changed; refuse stale diagnostic')
          credential=json.loads(secrets.get_secret_value(SecretId='eirepolitic/instagram/publishing')['SecretString'])
          token=credential['page_access_token']
          account=str(credential['instagram_account_id'])
          base='https://graph.facebook.com/v25.0'
          def graph(path,params):
              url=base+path+'?'+parse.urlencode(params)
              req=request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'},method='GET')
              try:
                  with request.urlopen(req,timeout=25) as response:data=json.loads(response.read())
                  return data,None
              except error.HTTPError as exc:
                  raw=exc.read()
                  try:payload=json.loads(raw)
                  except Exception:payload={}
                  detail=payload.get('error',{})
                  return None,{'http':exc.code,'code':detail.get('code'),'subcode':detail.get('error_subcode'),'type':detail.get('type')}
              except Exception as exc:
                  return None,{'type':type(exc).__name__}
          container,container_error=graph('/'+parent,{'fields':'id,status_code,status'})
          target_caption=control['request']['caption'].strip()
          matches=[];checked=0;last_error=None;after=None
          for _ in range(6):
              params={'fields':'id,media_type,timestamp,caption,permalink','limit':'100'}
              if after:params['after']=after
              media,err=graph('/'+account+'/media',params)
              if err:
                  last_error=err;break
              items=media.get('data',[]) if isinstance(media,dict) else []
              checked+=len(items)
              for post in items:
                  if str(post.get('caption','')).strip()==target_caption:
                      matches.append({'media_id':post.get('id'),'type':post.get('media_type'),'published_at':post.get('timestamp'),'permalink':post.get('permalink')})
              next_url=(media.get('paging') or {}).get('next')
              cursors=(media.get('paging') or {}).get('cursors') or {}
              if not next_url or not cursors.get('after'):break
              after=cursors['after']
          report={'checked_at_utc':datetime.now(timezone.utc).isoformat(),'publication_id':pub,'ledger_state':control.get('state'),'execution_state':attempt.get('state'),'revision':str(item.get('revision')),'operations':operations,'container':{'id':parent,'status_code':container.get('status_code') if container else None,'status':container.get('status') if container else None,'error':container_error},'account_media_checked':checked,'exact_caption_matches':matches,'account_media_error':last_error}
          output=Path('director/sessions/2026-09-27-recorded-voting-participation/publishing_review/tds_meta_reconciliation_20261107.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Persist sanitized read-only audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-09-27-recorded-voting-participation/publishing_review/tds_meta_reconciliation_20261107.json
          git commit -m 'Record read-only Meta reconciliation of TDs publish'
          git push origin HEAD:director/audit-voting-posts-20261107
