name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cognito_audit:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    outputs:
      pool: ${{ steps.probe.outputs.pool }}
      client: ${{ steps.probe.outputs.client }}
      domain: ${{ steps.probe.outputs.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume AWS administrator role for read-only inspection
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name hd-cognito-inspect-${GITHUB_RUN_ID} --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - id: probe
        name: Check OAuth features only
        run: |
          python - <<'PY'
          import boto3,os
          c=boto3.client('cognito-idp',region_name='us-east-2')
          pools=c.list_user_pools(MaxResults=60).get('UserPools',[])
          output={'pool':'count='+str(len(pools)), 'client':'unavailable', 'domain':'unavailable'}
          if len(pools)==1:
              p=c.describe_user_pool(UserPoolId=pools[0]['Id'])['UserPool']
              output['pool']='status='+str(p.get('Status','ACTIVE'))+' mfa='+str(p.get('MfaConfiguration'))+' enabled='+str(p.get('DeletionProtection'))
              output['domain']='has_domain='+str(bool(p.get('Domain') or p.get('CustomDomain')))+' tier='+str(p.get('UserPoolTier','unknown'))
              apps=c.list_user_pool_clients(UserPoolId=pools[0]['Id'],MaxResults=60).get('UserPoolClients',[])
              infos=[]
              for a in apps[:10]:
                  client=c.describe_user_pool_client(UserPoolId=pools[0]['Id'],ClientId=a['ClientId'])['UserPoolClient']
                  infos.append('name='+str(client.get('ClientName','?'))+' public='+str('ClientSecret' not in client)+' flows='+','.join(client.get('AllowedOAuthFlows',[]))+' scopes='+','.join(client.get('AllowedOAuthScopes',[]))+' refresh_days='+str(client.get('RefreshTokenValidity'))+' token_rotation='+str(client.get('RefreshTokenRotation',{}).get('Feature','unspecified'))+' callbacks='+str(len(client.get('CallbackURLs',[])))+' oauth_enabled='+str(client.get('AllowedOAuthFlowsUserPoolClient',False)))
              output['client']='clients='+str(len(apps))+' '+(' | '.join(infos))
          for k,v in output.items():
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(k+'='+str(v).replace('\n',' ')[:240]+'\n')
          print('Cognito metadata inspected; no domain, client IDs, callback URLs, secrets or users printed')
          PY
  pool:
    needs: cognito_audit
    runs-on: ubuntu-latest
    name: 'Pool: ${{ needs.cognito_audit.outputs.pool }}'
    steps:
      - run: 'true'
  client:
    needs: cognito_audit
    runs-on: ubuntu-latest
    name: 'OAuth: ${{ needs.cognito_audit.outputs.client }}'
    steps:
      - run: 'true'
  domain:
    needs: cognito_audit
    runs-on: ubuntu-latest
    name: 'Domain: ${{ needs.cognito_audit.outputs.domain }}'
    steps:
      - run: 'true'
