name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    outputs:
      resource: ${{ steps.read.outputs.resource }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing AWS administrator role for read-only inspection
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name hd-oauth-resource-read-${GITHUB_RUN_ID} --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - id: read
        name: Read MCP endpoint from current Lambda Function URL configuration
        run: |
          python - <<'PY'
          import boto3,os,urllib.parse
          lambda_client=boto3.client('lambda',region_name='us-east-2')
          fn='github-gpt-wrapper-GithubGptWrapper-SKhOCHfaqOtn'
          conf=lambda_client.get_function_url_config(FunctionName=fn)
          url=conf['FunctionUrl']
          parsed=urllib.parse.urlparse(url)
          assert parsed.scheme=='https' and parsed.hostname.endswith('.lambda-url.us-east-2.on.aws')
          assert conf['InvokeMode']=='BUFFERED'
          resource=url.rstrip('/')+'/director/mcp'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('resource='+resource+'\n')
          print('Existing public Lambda MCP endpoint read; AWS configuration unchanged')
          PY
  result:
    needs: inspect
    runs-on: ubuntu-latest
    name: 'Auth0 API Identifier: ${{ needs.inspect.outputs.resource }}'
    steps:
      - run: 'true'
