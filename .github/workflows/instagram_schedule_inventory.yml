name: Instagram schedule inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume existing AWS role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name director-instagram-audit-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Inspect October 26 publisher errors (read-only)
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python - <<'PY'
          import boto3,json,re
          from datetime import datetime,timezone
          from pathlib import Path
          client=boto3.client('logs',region_name='us-east-2')
          start=int(datetime(2026,10,26,14,55,tzinfo=timezone.utc).timestamp()*1000)
          end=int(datetime(2026,10,26,15,40,tzinfo=timezone.utc).timestamp()*1000)
          kwargs={'logGroupName':'/aws/lambda/eirepolitic-instagram-publisher','startTime':start,'endTime':end,'limit':10000}
          entries=[];pages=0
          while pages<12:
              response=client.filter_log_events(**kwargs);pages+=1
              for ev in response.get('events',[]):
                  msg=ev.get('message','').strip()
                  parts=msg.splitlines()
                  for part in parts:
                      if re.search('error|exception|traceback|publish outcome|timed out|task timed|runtime|meta|http |urlopen|status code|retry|throttl',part,re.I):
                          # retain only error type and short diagnostic phrases; never persist request payloads
                          if re.search('token|authorization|secret|Bearer|page_access|instagram_account_id',part,re.I):continue
                          part=re.sub(r'https?://[^\s]+','[URL]',part)
                          part=re.sub(r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b','[REDACTED]',part)
                          entries.append({'utc':datetime.fromtimestamp(ev['timestamp']/1000,timezone.utc).isoformat(),'detail':part[:240]})
              token=response.get('nextToken')
              if not token or token==kwargs.get('nextToken'):break
              kwargs['nextToken']=token
          report={'range':'2026-10-26T14:55:00Z to 15:40:00Z','pages':pages,'diagnostics':entries[-120:]}
          out=Path('director/sessions/2026-09-27-recorded-voting-participation/publishing_review/tds_lambda_error_audit_20261107.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Persist error diagnosis in isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-09-27-recorded-voting-participation/publishing_review/tds_lambda_error_audit_20261107.json
          git commit -m 'Record sanitized October 26 publisher diagnostics'
          git push origin HEAD:director/audit-voting-posts-20261107
