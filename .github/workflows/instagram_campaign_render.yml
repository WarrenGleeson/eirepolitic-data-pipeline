name: Instagram Campaign Render (Manual)

on:
  workflow_dispatch:
    inputs:
      campaign_slug:
        description: "Campaign folder under instagram/campaigns"
        required: false
        default: "constitutional_change_close_vote_v1"
      spec_file:
        description: "Render spec filename inside the campaign folder"
        required: false
        default: "render_spec.yml"
      limit:
        description: "Optional row limit override"
        required: false
        default: "3"
      upload_preview:
        description: "Upload generated preview assets to S3"
        required: false
        default: "false"
      preview_public_read:
        description: "Request public-read ACL on preview objects"
        required: false
        default: "false"
      preview_root_prefix:
        description: "S3 root prefix for generated previews"
        required: false
        default: "instagram/previews"

concurrency:
  group: instagram-campaign-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render_campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preview dependency
        if: ${{ inputs.campaign_slug == 'constitutional_change_close_vote_v1' }}
        run: python -m pip install Pillow

      - name: Install standard campaign dependencies
        if: ${{ inputs.campaign_slug != 'constitutional_change_close_vote_v1' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render constitutional-change preview
        if: ${{ inputs.campaign_slug == 'constitutional_change_close_vote_v1' }}
        shell: bash
        run: |
          set -euo pipefail
          python instagram/projects/constitutional_change_close_vote_v1/render.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('artifacts/instagram/constitutional_change_close_vote_v1').glob('slide_*.png'))
          assert len(files) == 6, len(files)
          for path in files:
              with Image.open(path) as im:
                  assert im.size == (1080, 1350), (path, im.size)
          print('verified', len(files), 'slides at 1080x1350')
          PY

      - name: Render standard campaign
        if: ${{ inputs.campaign_slug != 'constitutional_change_close_vote_v1' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: "eirepolitic-data"
        run: |
          set -o pipefail
          CAMPAIGN_SLUG="${{ inputs.campaign_slug }}"
          SPEC_FILE="${{ inputs.spec_file }}"
          LIMIT="${{ inputs.limit }}"
          CAMPAIGN_SLUG="${CAMPAIGN_SLUG:-member_profile_batch_v1}"
          SPEC_FILE="${SPEC_FILE:-render_spec.yml}"
          LIMIT="${LIMIT:-3}"
          SPEC_PATH="instagram/campaigns/${CAMPAIGN_SLUG}/${SPEC_FILE}"
          python process/instagram_render_campaign.py --campaign "${SPEC_PATH}" --limit "${LIMIT}"

      - name: Upload constitutional-change preview artifact
        if: ${{ always() && inputs.campaign_slug == 'constitutional_change_close_vote_v1' }}
        uses: actions/upload-artifact@v4
        with:
          name: constitutional-change-carousel-preview-${{ github.run_id }}
          path: artifacts/instagram/constitutional_change_close_vote_v1/
          if-no-files-found: error
          retention-days: 14

      - name: Upload standard campaign outputs
        if: ${{ always() && inputs.campaign_slug != 'constitutional_change_close_vote_v1' }}
        uses: actions/upload-artifact@v4
        with:
          name: instagram-campaign-render-output
          path: generated_posts/**
          if-no-files-found: warn
