name: Instagram factory render (generic)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project id'
        required: false
        default: 'bill_tracker_factory_v1'
      period:
        description: 'Period spec'
        required: false
        default: 'third_stage_full_review'
      preview_slug:
        description: 'Preview branch slug'
        required: false
        default: 'bill-tracker-third-stage-full-review'
      factory_ref:
        description: 'Factory ref'
        required: false
        default: '386b933'
      session_id:
        description: 'Director session id'
        required: false
        default: '2026-10-10-bill-tracker-third-stage'

permissions:
  contents: write

concurrency:
  group: instagram-factory-render-${{ github.event.inputs.project_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml pillow boto3 matplotlib requests

      - name: Check out approved factory worktree
        env:
          FACTORY_REF: ${{ github.event.inputs.factory_ref }}
        run: |
          set -euo pipefail
          REF="${FACTORY_REF:-386b933}"
          git fetch origin feature/instagram-monthly-post-framework
          git cat-file -e "${REF}^{commit}"
          git worktree add /tmp/approved-instagram-factory "$REF"

      - name: Inject project, locked inventory, and generic-render modules
        env:
          PROJECT_ID: ${{ github.event.inputs.project_id }}
        run: |
          set -euo pipefail
          cp -R "instagram/projects/${PROJECT_ID}" /tmp/approved-instagram-factory/instagram/projects/
          cp instagram/factory/contract.py /tmp/approved-instagram-factory/instagram/factory/
          cp instagram/factory/normalize.py /tmp/approved-instagram-factory/instagram/factory/
          cp instagram/factory/qa.py /tmp/approved-instagram-factory/instagram/factory/
          cp instagram/factory/review_page.py /tmp/approved-instagram-factory/instagram/factory/
          cp instagram/factory/publication_handoff.py /tmp/approved-instagram-factory/instagram/factory/
          cp instagram/factory/render_pipeline.py /tmp/approved-instagram-factory/instagram/factory/
          mkdir -p /tmp/approved-instagram-factory/director/sessions/2026-10-10-bill-tracker-third-stage
          cp director/sessions/2026-10-10-bill-tracker-third-stage/live_third_stage_inventory.csv /tmp/approved-instagram-factory/director/sessions/2026-10-10-bill-tracker-third-stage/
          cp director/sessions/2026-10-10-bill-tracker-third-stage/live_third_stage_reconciliation.md /tmp/approved-instagram-factory/director/sessions/2026-10-10-bill-tracker-third-stage/

      - name: Render full review, run QA, and stage review page
        id: render
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
          PERIOD_INPUT: ${{ github.event.inputs.period }}
          PREVIEW_SLUG_INPUT: ${{ github.event.inputs.preview_slug }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/director/sessions/2026-10-10-bill-tracker-third-stage/full_render_run.log"
          cd /tmp/approved-instagram-factory
          python - <<'PY' > "$LOG" 2>&1
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.getcwd())
          from instagram.factory.render_pipeline import run_and_normalize
          from instagram.factory.review_page import build_review_html, stage_review_assets
          project_id=os.environ['PROJECT_ID']
          period=os.environ.get('PERIOD_INPUT') or None
          preview_slug=os.environ.get('PREVIEW_SLUG_INPUT') or project_id
          workspace=Path(os.environ['GITHUB_WORKSPACE'])
          result=run_and_normalize(project_id, period=period, output_root=workspace/'generated_render')
          summary={
              'project_id':result.project_id,
              'period_key':result.period_key,
              'source_batch_id':result.source_batch_id,
              'slide_count':len(result.slides),
              'contact_sheet_count':len(result.contact_sheets),
              'qa_all_passed':result.qa.all_passed,
              'qa_checks':[{'name':c.name,'passed':c.passed,'detail':c.detail} for c in result.qa.checks],
              'preview_slug':preview_slug,
          }
          (workspace/'render_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary, indent=2))
          if not result.qa.all_passed:
              raise SystemExit(1)
          review_dir=workspace/'factory_web_review'
          staged=stage_review_assets(result,review_dir)
          (review_dir/'index.html').write_text(build_review_html(staged,project_label='Bill Tracker · Third Stage · Full Review'),encoding='utf-8')
          PY
          STATUS=$?
          cat "$LOG"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-10-10-bill-tracker-third-stage/full_render_run.log
          git commit -m 'director: record full Third Stage render run' || true
          git push origin HEAD:sly/session/2026-10-10-bill-tracker-third-stage
          echo "preview_slug=${PREVIEW_SLUG_INPUT:-$PROJECT_ID}" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Publish web review to preview branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_SLUG: ${{ steps.render.outputs.preview_slug }}
        run: |
          set -euo pipefail
          cd factory_web_review
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "preview: ${PREVIEW_SLUG} review ${GITHUB_RUN_ID}"
          git branch -M "previews/${PREVIEW_SLUG}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/previews/${PREVIEW_SLUG}"

      - name: Upload backup package
        uses: actions/upload-artifact@v4
        with:
          name: instagram-factory-render-${{ github.event.inputs.project_id }}-${{ github.run_id }}
          path: generated_render/
          if-no-files-found: error
          retention-days: 30
