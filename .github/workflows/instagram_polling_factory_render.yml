name: Diagnose Second Stage scheduling state
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director AWS administrator role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name second-stage-diagnose-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Inspect ledger and schedules
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          python - <<'PY'
          import json
          from pathlib import Path
          import boto3
          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          resp=table.scan(); items=resp.get('Items',[])
          while resp.get('LastEvaluatedKey'):
              resp=table.scan(ExclusiveStartKey=resp['LastEvaluatedKey']); items.extend(resp.get('Items',[]))
          pubs=[]
          for item in items:
              req=item.get('request') or {}
              if req.get('project_id')=='bill_tracker_second_stage' or 'bill-tracker-second-stage' in str(item.get('publication_id','')):
                  sch=item.get('schedule') or {}
                  pubs.append({'pk':item.get('pk'),'sk':item.get('sk'),'publication_id':item.get('publication_id'),'state':item.get('state'),'period':req.get('period'),'scheduled_at_utc':sch.get('scheduled_at_utc'),'schedule_name':sch.get('schedule_name'),'request_caption_prefix':str(req.get('caption',''))[:80]})
          client=boto3.client('scheduler',region_name='us-east-2')
          schedules=[]; token=None
          while True:
              kwargs={'MaxResults':100}
              if token: kwargs['NextToken']=token
              r=client.list_schedules(**kwargs)
              for s in r.get('Schedules',[]):
                  n=s.get('Name','')
                  if 'bill-tracker-second-stage' in n:
                      schedules.append({'name':n,'state':s.get('State'),'arn':s.get('Arn')})
              token=r.get('NextToken')
              if not token: break
          out={'publication_count':len(pubs),'publications':sorted(pubs,key=lambda x:(x.get('period') or '',x.get('sk') or '')),'schedule_count':len(schedules),'schedules':sorted(schedules,key=lambda x:x['name'])}
          Path('diagnostic.json').write_text(json.dumps(out,indent=2,default=str)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Publish diagnostic
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out && cp diagnostic.json out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "diagnostic: Second Stage scheduling state ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-schedule-diagnostic
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-schedule-diagnostic
