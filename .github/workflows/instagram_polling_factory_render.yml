name: Build Second Stage schedule plan
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build_plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas
      - run: python process/tmp_build_second_stage_schedule_plan.py
      - name: Publish schedule review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          cp artifacts/second-stage-schedule-plan/plan.json out/
          cp artifacts/second-stage-schedule-plan/plan.md out/
          python - <<'PY'
          import html
          from pathlib import Path
          md=Path('out/plan.md').read_text(encoding='utf-8')
          body='<pre style="white-space:pre-wrap;font-family:Arial,sans-serif">'+html.escape(md)+'</pre>'
          Path('out/index.html').write_text('<!doctype html><meta charset="utf-8"><title>Second Stage schedule plan</title><body style="max-width:1000px;margin:40px auto;padding:0 20px;background:#0f2f24;color:#f4ead7">'+body+'</body>',encoding='utf-8')
          PY
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: Second Stage schedule plan ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-schedule-plan
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-schedule-plan
