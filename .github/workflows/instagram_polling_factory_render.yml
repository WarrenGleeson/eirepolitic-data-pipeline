name: Pause remaining Second Stage publications
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pause:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-2
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director AWS administrator role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name second-stage-pause-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - run: python -m pip install --quiet boto3
      - name: Cancel Posts 5 through 27 and remove EventBridge schedules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          import boto3
          from publishing.control import PublicationControlService
          from publishing.dynamodb_ledger import DynamoDBPublicationLedger
          from publishing.scheduler import EventBridgePublicationScheduler, SchedulerTarget

          cf=boto3.client('cloudformation',region_name='us-east-2')
          def output(stack,key):
              r=cf.describe_stacks(StackName=stack)['Stacks'][0]['Outputs']
              return next(x['OutputValue'] for x in r if x['OutputKey']==key)
          target=SchedulerTarget(
              lambda_arn=boto3.client('lambda',region_name='us-east-2').get_function(FunctionName='eirepolitic-instagram-publisher')['Configuration']['FunctionArn'],
              role_arn=output('eirepolitic-instagram-scheduler-support','SchedulerExecutionRoleArn'),
              dlq_arn=output('eirepolitic-instagram-scheduler-support','SchedulerDeadLetterQueueArn'),
          )
          scheduler=EventBridgePublicationScheduler(boto3.client('scheduler',region_name='us-east-2'),target)
          ledger=DynamoDBPublicationLedger(boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications'))
          control=PublicationControlService(ledger)
          records=control.scheduled()
          selected=[]
          for rec in records:
              req=rec.request
              if req.project_id!='bill_tracker_second_stage':
                  continue
              m=re.fullmatch(r'post(\d+)',req.period)
              if not m:
                  continue
              post=int(m.group(1))
              if 5<=post<=27:
                  selected.append((post,rec))
          selected.sort(key=lambda x:x[0])
          results=[]
          for post,rec in selected:
              if rec.schedule is not None:
                  scheduler.cancel(rec.schedule)
              cancelled=control.cancel(rec.request.publication_id)
              results.append({'post':post,'publication_id':rec.request.publication_id,'state':cancelled.state})
              print('paused',post,rec.request.publication_id,cancelled.state)
          if len(results)!=23:
              raise SystemExit(f'expected 23 scheduled posts 5-27, found {len(results)}')
          remaining=[]
          for rec in control.scheduled():
              if rec.request.project_id=='bill_tracker_second_stage':
                  remaining.append({'period':rec.request.period,'publication_id':rec.request.publication_id})
          Path('pause-results.json').write_text(json.dumps({'cancelled':results,'remaining_second_stage_scheduled':remaining},indent=2)+'\n',encoding='utf-8')
          if any(5<=int(x['period'].replace('post',''))<=27 for x in remaining if x['period'].startswith('post')):
              raise SystemExit('one or more Posts 5-27 remain scheduled')
          print('verified Posts 5-27 are no longer scheduled')
          PY
      - name: Publish pause audit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out && cp pause-results.json out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "audit: paused Second Stage Posts 5-27 ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-pause-audit
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-pause-audit
