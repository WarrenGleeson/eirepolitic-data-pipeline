name: Capture Second Stage repair failure
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture failed repair log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view 38663062916 --repo "$GITHUB_REPOSITORY" --log-failed > repair-failure.log 2>&1
          cat repair-failure.log
          exit 0
      - name: Publish failure log
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out && cp repair-failure.log out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "diagnostic: Second Stage repair failure ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-repair-failure
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-repair-failure
