name: Instagram polling factory render
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/bill-vote-visual-options
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 pandas pillow
      - name: Download canonical Bill Tracker artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11010749005/zip" -o /tmp/canonical.zip
          mkdir -p /tmp/canonical && unzip -q /tmp/canonical.zip -d /tmp/canonical
      - name: Extract canonical corners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          c=[]
          for p in Path('/tmp/canonical').rglob('*.png'):
              try:
                  with Image.open(p) as im:
                      if im.size==(1080,1350): c.append(p)
              except Exception: pass
          if not c: raise SystemExit('No canonical slide found')
          src=Image.open(c[0]).convert('RGBA'); out=Path('instagram/templates/assets'); out.mkdir(parents=True,exist_ok=True)
          for n,b in {'corner_tl.png':(0,0,155,155),'corner_tr.png':(925,0,1080,155),'corner_bl.png':(0,1195,155,1350),'corner_br.png':(925,1195,1080,1350)}.items(): src.crop(b).save(out/n)
          PY
      - run: python process/tmp_mock_second_stage_sponsor_layout.py
      - name: Publish fresh mock preview
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          cp artifacts/second-stage-sponsor-mock/broadcasting-sponsor-mock.png out/
          cat > out/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Stage clean-rule mock</title><style>body{margin:0;background:#0f2f24;color:#f4ead7;font-family:Arial,sans-serif;text-align:center}main{max-width:900px;margin:auto;padding:24px}img{width:100%;height:auto}</style></head><body><main><h1>Broadcasting (Amendment) Bill 2026 — clean-rule mock</h1><img src="broadcasting-sponsor-mock.png"></main></body></html>
          HTML
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "preview: clean-rule Second Stage mock ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-sponsor-mock-v2
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-sponsor-mock-v2
