name: Audit repaired Second Stage copy for truncation fragments
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit_fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit future Posts 5-27 for malformed copy fragments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          base='https://raw.githubusercontent.com/eirepolitic/Eirepolitic-data-pipeline/previews/bill-tracker-second-stage-repaired'
          manifest=json.loads(urllib.request.urlopen(base+'/manifest.json',timeout=30).read().decode('utf-8'))
          enrichment=json.loads(urllib.request.urlopen(base+'/enrichment.json',timeout=60).read().decode('utf-8'))
          by_title={r.get('title'):r for r in enrichment.get('rows',[])}
          post_by_title={title:int(p['post']) for p in manifest['posts'] for title in p['bills']}
          fields=('what','practical','context','issues')
          issues=[]
          def add(title,field,reason,text):
              issues.append({'post':post_by_title[title],'title':title,'field':field,'reason':reason,'text':text})
          for title,row in by_title.items():
              post=post_by_title.get(title)
              if post is None or post<5: continue
              for field in fields:
                  text=str(row.get(field,'') or '').strip()
                  words=re.findall(r"\b[\w’'-]+\b",text)
                  if len(words)<7:
                      add(title,field,'too_short',text)
                  if re.search(r'(?i)(?:following|things|reasons|measures|changes|provisions|objectives)\s*:\s*(?:\d+[.)]?)?\s*$',text):
                      add(title,field,'list_intro_without_list',text)
                  if re.search(r'(?i)(?:^|\s)\d+[.)]\s*$',text):
                      add(title,field,'ends_with_numbered_item_marker',text)
                  if re.search(r'[:;,\-–—]\s*$',text):
                      add(title,field,'ends_with_open_punctuation',text)
                  if text.count('(')!=text.count(')'):
                      add(title,field,'unbalanced_parentheses',text)
                  if text.count('“')!=text.count('”'):
                      add(title,field,'unbalanced_quotes',text)
                  if re.search(r'\b(?:and|or|to|of|for|with|including|such as|namely)\s*$',text,re.I):
                      add(title,field,'ends_mid_phrase',text)
                  if re.search(r'(?i)\b(?:section|part|chapter)\s+\d+\s*$',text):
                      add(title,field,'ends_on_heading_fragment',text)
                  if re.search(r'(?i)\b(?:1|2|3)\.$',text) and len(words)<25:
                      add(title,field,'short_numbered_fragment',text)
          # de-duplicate exact issue entries
          seen=set(); uniq=[]
          for x in issues:
              k=(x['post'],x['title'],x['field'],x['reason'],x['text'])
              if k not in seen:
                  seen.add(k); uniq.append(x)
          out={'issue_count':len(uniq),'affected_bill_count':len(set(x['title'] for x in uniq)),'affected_posts':sorted(set(x['post'] for x in uniq)),'issues':sorted(uniq,key=lambda x:(x['post'],x['title'],x['field'],x['reason']))}
          Path('fragment-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:out[k] for k in ('issue_count','affected_bill_count','affected_posts')},indent=2))
          for x in out['issues']:
              print(f"POST {x['post']} | {x['title']} | {x['field']} | {x['reason']} | {x['text']}")
          PY
      - name: Publish fragment audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir out && cp fragment-audit.json out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "audit: repaired Second Stage fragment QA ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-fragment-audit
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-fragment-audit
