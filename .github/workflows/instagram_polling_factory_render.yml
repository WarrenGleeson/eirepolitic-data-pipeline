name: Inventory live Instagram schedule for Second Stage reschedule
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume administrator role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name schedule-inventory-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - run: python -m pip install --quiet boto3
      - name: Export all currently scheduled publications
        shell: bash
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          import boto3

          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          response=table.query(
              IndexName='state-scheduled_at-index',
              KeyConditionExpression='#state = :state',
              ExpressionAttributeNames={'#state':'state'},
              ExpressionAttributeValues={':state':'scheduled'},
              ScanIndexForward=True,
          )
          items=response.get('Items',[])
          while response.get('LastEvaluatedKey'):
              response=table.query(
                  IndexName='state-scheduled_at-index',
                  KeyConditionExpression='#state = :state',
                  ExpressionAttributeNames={'#state':'state'},
                  ExpressionAttributeValues={':state':'scheduled'},
                  ScanIndexForward=True,
                  ExclusiveStartKey=response['LastEvaluatedKey'],
              )
              items.extend(response.get('Items',[]))

          def plain(v):
              if isinstance(v,Decimal):
                  return int(v) if v == int(v) else float(v)
              if isinstance(v,dict): return {k:plain(x) for k,x in v.items()}
              if isinstance(v,list): return [plain(x) for x in v]
              return v

          rows=[]
          for item in items:
              req=item.get('request') or {}
              sch=item.get('schedule') or {}
              rows.append(plain({
                  'scheduled_at_utc': sch.get('scheduled_at_utc') or item.get('scheduled_at_utc'),
                  'scheduled_local': sch.get('scheduled_local'),
                  'timezone': sch.get('timezone'),
                  'publication_id': item.get('publication_id'),
                  'project_id': req.get('project_id'),
                  'period': req.get('period'),
                  'state': item.get('state'),
                  'schedule_name': sch.get('schedule_name'),
              }))
          rows=sorted(rows,key=lambda r:r.get('scheduled_at_utc') or '')
          Path('schedule-inventory.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Publish inventory branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir out && cp schedule-inventory.json out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "audit: live schedule inventory ${GITHUB_RUN_ID}"
          git branch -M previews/instagram-live-schedule-inventory
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/instagram-live-schedule-inventory
