name: Capture failed scheduling run log
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  capture_log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture failed run log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view 38309019839 --repo "$GITHUB_REPOSITORY" --log-failed > failed-run.log 2>&1
          cat failed-run.log
          exit 0
      - name: Publish failed run log
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out && cp failed-run.log out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "diagnostic: scheduling failed run log ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-failed-run-log
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-failed-run-log
