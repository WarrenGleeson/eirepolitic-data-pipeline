name: Extract suspect repaired Second Stage copy rows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract suspect rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          base='https://raw.githubusercontent.com/eirepolitic/Eirepolitic-data-pipeline/previews/bill-tracker-second-stage-repaired'
          enrichment=json.loads(urllib.request.urlopen(base+'/enrichment.json',timeout=60).read().decode('utf-8'))
          titles={
            'Planning and Development (Provision of Public Housing) Bill 2026',
            'Social Housing Passport Bill 2026',
            'Health (Amendment) Bill 2026',
            'Comptroller and Auditor General (Due Diligence Complicity Audit) (Amendment) Bill 2026',
            'Valuation (Amendment) Bill 2026',
            'Forty-first Amendment of the Constitution (Right to Housing) Bill 2026',
            'Public Art Mural (Exempted Development) Bill 2026',
            'River Boyne Task Force Bill 2023',
            'Taxes Consolidation (Rights of Performers and Film Workers) (Amendment) Bill 2025',
          }
          rows=[r for r in enrichment.get('rows',[]) if r.get('title') in titles]
          if len(rows)!=len(titles):
              found={r.get('title') for r in rows}
              raise SystemExit(f'missing titles: {sorted(titles-found)}')
          Path('suspect-rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Publish rows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir out && cp suspect-rows.json out/
          cd out
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "audit: suspect repaired copy rows ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-suspect-rows
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-suspect-rows
