name: Schedule final repaired Second Stage posts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  schedule:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 35
    env:
      AWS_REGION: us-east-2
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume administrator role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name second-stage-final-schedule-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - run: python -m pip install --quiet boto3 pillow
      - name: Resolve publishing resources
        shell: bash
        run: |
          set -euo pipefail
          echo "BUCKET=$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-runtime-support --query "Stacks[0].Outputs[?OutputKey=='ApprovedAssetsBucketName'].OutputValue | [0]" --output text)" >> "$GITHUB_ENV"
          echo "FUNCTION_ARN=$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)" >> "$GITHUB_ENV"
          echo "ROLE_ARN=$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)" >> "$GITHUB_ENV"
          echo "DLQ_ARN=$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)" >> "$GITHUB_ENV"
      - name: Verify repaired review gates
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://raw.githubusercontent.com/eirepolitic/Eirepolitic-data-pipeline/previews/bill-tracker-second-stage-repaired'
          g=json.loads(urllib.request.urlopen(base+'/public-copy-gate.json',timeout=30).read().decode())
          f=json.loads(urllib.request.urlopen(base+'/future-fragment-audit.json',timeout=30).read().decode())
          m=json.loads(urllib.request.urlopen(base+'/manifest.json',timeout=30).read().decode())
          if g.get('failure_count')!=0: raise SystemExit(f'copy gate failed: {g}')
          if f.get('bad_count')!=0: raise SystemExit(f'fragment gate failed: {f}')
          if m.get('bill_count')!=108 or m.get('post_count')!=27: raise SystemExit(f'bad manifest counts: {m}')
          print('repaired branch gates verified: 0 copy failures, 0 fragment failures')
          PY
      - name: Verify Posts 5-27 inactive before final reschedule
        shell: bash
        run: |
          python - <<'PY'
          import re,boto3
          from publishing.control import PublicationControlService
          from publishing.dynamodb_ledger import DynamoDBPublicationLedger
          control=PublicationControlService(DynamoDBPublicationLedger(boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')))
          bad=[]
          for rec in control.scheduled():
              if rec.request.project_id!='bill_tracker_second_stage': continue
              m=re.fullmatch(r'post(\d+)',rec.request.period)
              if m and 5<=int(m.group(1))<=27:
                  bad.append({'post':int(m.group(1)),'publication_id':rec.request.publication_id})
          if bad: raise SystemExit(f'Posts 5-27 unexpectedly scheduled: {bad}')
          print('Posts 5-27 confirmed inactive')
          PY
      - name: Schedule final repaired Posts 5-27
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from dataclasses import asdict
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          import boto3
          from publishing.scheduler import SchedulerTarget
          from publishing.standard_pipeline import prepare_standard_publication

          base='https://raw.githubusercontent.com/eirepolitic/Eirepolitic-data-pipeline/previews/bill-tracker-second-stage-repaired'
          manifest=json.loads(urllib.request.urlopen(base+'/manifest.json',timeout=30).read().decode())
          posts={int(p['post']):p for p in manifest['posts']}
          start=datetime(2026,10,17,8,0,tzinfo=timezone.utc)
          tags=['#EirePolitic','#Oireachtas','#IrishPolitics','#Legislation','#DáilÉireann']
          slide_names=['00-cover.png','01-bill.png','02-bill.png','03-bill.png','04-bill.png','05-process-glossary.png','06-second-stage-explainer.png']
          target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN'])
          dynamo=boto3.resource('dynamodb',region_name='us-east-2')
          s3=boto3.client('s3',region_name='us-east-2')
          scheduler=boto3.client('scheduler',region_name='us-east-2')
          root=Path('final_packages'); root.mkdir(exist_ok=True)
          results=[]

          for offset,post in enumerate(range(5,28)):
              p=posts[post]
              scheduled=start.replace(hour=(8 if offset%2==0 else 12))+timedelta(days=offset//2)
              if post==27:
                  intro=("This final post in our Second Stage series covers the remaining four Bills currently at this stage. "
                         "Second Stage is where the Dáil or Seanad considers a Bill’s main purpose and whether it should continue through the legislative process.")
              else:
                  intro=("Continuing our look at Bills currently at Second Stage, these next four Bills are at the point where the Dáil or Seanad considers "
                         "the Bill’s main purpose and whether it should continue through the legislative process.")
              caption=(intro+'\n\nThis post covers:\n\n'+'\n'.join('• '+x for x in p['bills'])+
                       '\n\nSwipe through to see what each Bill would do, who brought it forward, how long it has been at Second Stage, and the latest recorded activity.'+
                       '\n\n'+' '.join(tags))
              d=root/f'post{post:02d}'; d.mkdir(exist_ok=True)
              (d/'caption.txt').write_text(caption+'\n',encoding='utf-8')
              slides=[]
              for i,name in enumerate(slide_names,1):
                  data=urllib.request.urlopen(f'{base}/post{post:02d}/{name}',timeout=60).read()
                  (d/name).write_bytes(data)
                  slides.append({'id':f'post{post:02d}-slide-{i:02d}','path':name,'width':1080,'height':1350})
              handoff={
                  'schema_version':1,
                  'project_id':'bill_tracker_second_stage',
                  'period_key':f'post{post:02d}',
                  'source_batch_id':'final-repaired-second-stage-2026-10-16',
                  'qa_all_passed':True,
                  'review_state':'approved_for_scheduling',
                  'factory_publication_enabled':False,
                  'slides':slides,
                  'caption_path':'caption.txt',
                  'source_manifest_path':None,
                  'operator_contract':{'requires_explicit_publish_approval':True,'factory_does_not_publish':True,'caption_override_required_when_caption_path_is_null':False},
              }
              (d/'publication_handoff.json').write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              r=prepare_standard_publication(
                  artifact_root=d,
                  factory_run_id='20261016r2',
                  approved_by='user-approved-repair-plan-2026-10-14',
                  mode='scheduled',
                  bucket=os.environ['BUCKET'],
                  dynamodb_resource=dynamo,
                  s3_client=s3,
                  scheduler_client=scheduler,
                  scheduler_target=target,
                  scheduled_local=scheduled.strftime('%Y-%m-%dT%H:%M:%S'),
                  timezone_name='UTC',
                  caption_override=None,
                  options_json='{}',
              )
              v=asdict(r); expected=scheduled.isoformat().replace('+00:00','Z')
              if v['state']!='scheduled': raise RuntimeError(f'post {post} state {v["state"]}')
              if v['scheduled_at_utc']!=expected: raise RuntimeError(f'post {post} time {v["scheduled_at_utc"]} != {expected}')
              es=scheduler.get_schedule(Name=v['schedule_name'],GroupName='eirepolitic-instagram')
              if es.get('State')!='ENABLED': raise RuntimeError(f'post {post} EventBridge state {es.get("State")}')
              results.append({'post':post,'scheduled_at_utc':expected,'publication_id':v['publication_id'],'asset_package_id':v['asset_package_id'],'schedule_name':v['schedule_name'],'eventbridge_state':es.get('State')})
              print(f'scheduled final repaired post {post:02d} -> {expected}')

          if len(results)!=23: raise RuntimeError(f'expected 23 schedules, got {len(results)}')
          Path('final-schedule-results.json').write_text(json.dumps(results,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'scheduled':len(results),'first':results[0]['scheduled_at_utc'],'last':results[-1]['scheduled_at_utc']},indent=2))
          PY
      - name: Publish final scheduling audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir audit && cp final-schedule-results.json audit/
          python - <<'PY'
          import json,html
          from pathlib import Path
          rows=json.loads(Path('final-schedule-results.json').read_text())
          parts=['<!doctype html><meta charset="utf-8"><title>Final repaired Second Stage schedule</title><body style="max-width:1000px;margin:40px auto;font-family:Arial;background:#0f2f24;color:#f4ead7"><h1>Final repaired Second Stage schedule</h1><p>23 replacement posts scheduled from repaired assets. All EventBridge schedules verified enabled.</p><table border="1" cellpadding="8" cellspacing="0"><tr><th>Post</th><th>UTC</th><th>State</th></tr>']
          for r in rows: parts.append(f'<tr><td>{r["post"]}</td><td>{html.escape(r["scheduled_at_utc"])}</td><td>{html.escape(r["eventbridge_state"])}</td></tr>')
          parts.append('</table></body>'); Path('audit/index.html').write_text(''.join(parts),encoding='utf-8')
          PY
          cd audit
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "audit: final repaired Second Stage schedule ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-final-schedule-audit
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-final-schedule-audit
