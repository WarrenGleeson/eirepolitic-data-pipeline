name: Reschedule repaired Second Stage around occupied morning slots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reschedule:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 40
    env:
      AWS_REGION: us-east-2
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume administrator role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name second-stage-reschedule-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - run: python -m pip install --quiet boto3 pillow
      - name: Resolve publishing resources
        shell: bash
        run: |
          set -euo pipefail
          echo "BUCKET=$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-runtime-support --query "Stacks[0].Outputs[?OutputKey=='ApprovedAssetsBucketName'].OutputValue | [0]" --output text)" >> "$GITHUB_ENV"
          echo "FUNCTION_ARN=$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)" >> "$GITHUB_ENV"
          echo "ROLE_ARN=$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)" >> "$GITHUB_ENV"
          echo "DLQ_ARN=$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)" >> "$GITHUB_ENV"
      - name: Reschedule Posts 5-27 around occupied slots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          from dataclasses import asdict
          from datetime import datetime, timezone
          from pathlib import Path
          import boto3
          from publishing.control import PublicationControlService
          from publishing.dynamodb_ledger import DynamoDBPublicationLedger
          from publishing.scheduler import EventBridgePublicationScheduler, SchedulerTarget
          from publishing.standard_pipeline import prepare_standard_publication

          repaired_base='https://raw.githubusercontent.com/WarrenGleeson/eirepolitic-data-pipeline/previews/bill-tracker-second-stage-repaired'
          manifest=json.loads(urllib.request.urlopen(repaired_base+'/manifest.json',timeout=30).read().decode('utf-8'))
          copy_gate=json.loads(urllib.request.urlopen(repaired_base+'/public-copy-gate.json',timeout=30).read().decode('utf-8'))
          fragment_gate=json.loads(urllib.request.urlopen(repaired_base+'/future-fragment-audit.json',timeout=30).read().decode('utf-8'))
          if copy_gate.get('failure_count') != 0 or fragment_gate.get('bad_count') != 0:
              raise SystemExit(f'repaired asset gates are not clean: copy={copy_gate} fragments={fragment_gate}')

          # Exact user-approved strategy based on the live inventory:
          # 17-27 Oct: 08:00 occupied by party_issue_monthly_profile_v2, use 12:00 only.
          # From 28 Oct: use both 08:00 and 12:00.
          plan={
              5:'2026-10-17T12:00:00Z',
              6:'2026-10-18T12:00:00Z',
              7:'2026-10-19T12:00:00Z',
              8:'2026-10-20T12:00:00Z',
              9:'2026-10-21T12:00:00Z',
              10:'2026-10-22T12:00:00Z',
              11:'2026-10-23T12:00:00Z',
              12:'2026-10-24T12:00:00Z',
              13:'2026-10-25T12:00:00Z',
              14:'2026-10-26T12:00:00Z',
              15:'2026-10-27T12:00:00Z',
              16:'2026-10-28T08:00:00Z',
              17:'2026-10-28T12:00:00Z',
              18:'2026-10-29T08:00:00Z',
              19:'2026-10-29T12:00:00Z',
              20:'2026-10-30T08:00:00Z',
              21:'2026-10-30T12:00:00Z',
              22:'2026-10-31T08:00:00Z',
              23:'2026-10-31T12:00:00Z',
              24:'2026-11-01T08:00:00Z',
              25:'2026-11-01T12:00:00Z',
              26:'2026-11-02T08:00:00Z',
              27:'2026-11-02T12:00:00Z',
          }
          if len(plan)!=23 or len(set(plan.values()))!=23:
              raise SystemExit('invalid target plan')

          dynamo=boto3.resource('dynamodb',region_name='us-east-2')
          table=dynamo.Table('eirepolitic-publications')
          scheduler_client=boto3.client('scheduler',region_name='us-east-2')
          target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN'])
          event_scheduler=EventBridgePublicationScheduler(scheduler_client,target)
          ledger=DynamoDBPublicationLedger(table)
          control=PublicationControlService(ledger)

          # Read every scheduled publication and assert our target slots are free of unrelated work.
          resp=table.query(
              IndexName='state-scheduled_at-index',
              KeyConditionExpression='#state = :state',
              ExpressionAttributeNames={'#state':'state'},
              ExpressionAttributeValues={':state':'scheduled'},
              ScanIndexForward=True,
          )
          items=resp.get('Items',[])
          while resp.get('LastEvaluatedKey'):
              resp=table.query(
                  IndexName='state-scheduled_at-index',
                  KeyConditionExpression='#state = :state',
                  ExpressionAttributeNames={'#state':'state'},
                  ExpressionAttributeValues={':state':'scheduled'},
                  ScanIndexForward=True,
                  ExclusiveStartKey=resp['LastEvaluatedKey'],
              )
              items.extend(resp.get('Items',[]))

          target_times=set(plan.values())
          unrelated_conflicts=[]
          morning_occupancy=[]
          for item in items:
              req=item.get('request') or {}; sch=item.get('schedule') or {}
              ts=sch.get('scheduled_at_utc') or item.get('scheduled_at_utc')
              project=req.get('project_id')
              if project!='bill_tracker_second_stage' and ts in target_times:
                  unrelated_conflicts.append({'time':ts,'publication_id':item.get('publication_id'),'project_id':project})
              if project!='bill_tracker_second_stage' and ts and ts.startswith(tuple(f'2026-10-{d:02d}' for d in range(17,28))) and ts.endswith('T08:00:00Z'):
                  morning_occupancy.append({'time':ts,'publication_id':item.get('publication_id'),'project_id':project})
          if unrelated_conflicts:
              raise SystemExit(f'target slots are occupied by unrelated publications: {unrelated_conflicts}')
          expected_mornings={f'2026-10-{d:02d}T08:00:00Z' for d in range(17,28)}
          observed_mornings={x['time'] for x in morning_occupancy}
          if observed_mornings != expected_mornings:
              raise SystemExit(f'morning occupancy changed since inventory; expected={sorted(expected_mornings)} observed={sorted(observed_mornings)}')

          # Cancel every currently active Second Stage Post 5-27 schedule, leaving unrelated publications untouched.
          cancelled=[]
          active=[]
          for rec in control.scheduled():
              if rec.request.project_id!='bill_tracker_second_stage':
                  continue
              m=re.fullmatch(r'post(\d+)',rec.request.period)
              if not m:
                  continue
              post=int(m.group(1))
              if 5 <= post <= 27:
                  active.append((post,rec))
          active.sort(key=lambda x:x[0])
          if len(active)!=23:
              raise SystemExit(f'expected 23 currently scheduled Second Stage posts, found {len(active)}')
          for post,rec in active:
              if rec.schedule is not None:
                  event_scheduler.cancel(rec.schedule)
              cancelled_rec=control.cancel(rec.request.publication_id)
              cancelled.append({'post':post,'publication_id':rec.request.publication_id,'state':cancelled_rec.state})
              print('cancelled old Second Stage schedule',post,rec.request.publication_id)

          leftovers=[]
          for rec in control.scheduled():
              if rec.request.project_id!='bill_tracker_second_stage':
                  continue
              m=re.fullmatch(r'post(\d+)',rec.request.period)
              if m and 5 <= int(m.group(1)) <= 27:
                  leftovers.append(rec.request.publication_id)
          if leftovers:
              raise SystemExit(f'old Second Stage schedules remain active: {leftovers}')

          posts={int(p['post']):p for p in manifest['posts']}
          tags=['#EirePolitic','#Oireachtas','#IrishPolitics','#Legislation','#DáilÉireann']
          slide_names=['00-cover.png','01-bill.png','02-bill.png','03-bill.png','04-bill.png','05-process-glossary.png','06-second-stage-explainer.png']
          root=Path('reschedule_packages'); root.mkdir(exist_ok=True)
          s3=boto3.client('s3',region_name='us-east-2')
          created=[]

          for post in range(5,28):
              p=posts[post]
              scheduled=datetime.fromisoformat(plan[post].replace('Z','+00:00'))
              if post==27:
                  intro=("This final post in our Second Stage series covers the remaining four Bills currently at this stage. "
                         "Second Stage is where the Dáil or Seanad considers a Bill’s main purpose and whether it should continue through the legislative process.")
              else:
                  intro=("Continuing our look at Bills currently at Second Stage, these next four Bills are at the point where the Dáil or Seanad considers "
                         "the Bill’s main purpose and whether it should continue through the legislative process.")
              caption=(intro+'\n\nThis post covers:\n\n'+'\n'.join('• '+x for x in p['bills'])+
                       '\n\nSwipe through to see what each Bill would do, who brought it forward, how long it has been at Second Stage, and the latest recorded activity.'+
                       '\n\n'+' '.join(tags))
              d=root/f'post{post:02d}'; d.mkdir(exist_ok=True)
              (d/'caption.txt').write_text(caption+'\n',encoding='utf-8')
              slides=[]
              for ordinal,name in enumerate(slide_names,1):
                  data=urllib.request.urlopen(f'{repaired_base}/post{post:02d}/{name}',timeout=60).read()
                  (d/name).write_bytes(data)
                  slides.append({'id':f'post{post:02d}-slide-{ordinal:02d}','path':name,'width':1080,'height':1350})
              handoff={
                  'schema_version':1,
                  'project_id':'bill_tracker_second_stage',
                  'period_key':f'post{post:02d}',
                  'source_batch_id':'final-repaired-second-stage-2026-10-16',
                  'qa_all_passed':True,
                  'review_state':'approved_for_scheduling',
                  'factory_publication_enabled':False,
                  'slides':slides,
                  'caption_path':'caption.txt',
                  'source_manifest_path':None,
                  'operator_contract':{'requires_explicit_publish_approval':True,'factory_does_not_publish':True,'caption_override_required_when_caption_path_is_null':False},
              }
              (d/'publication_handoff.json').write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              result=prepare_standard_publication(
                  artifact_root=d,
                  factory_run_id='20261016r3',
                  approved_by='user-reschedule-request-2026-10-16',
                  mode='scheduled',
                  bucket=os.environ['BUCKET'],
                  dynamodb_resource=dynamo,
                  s3_client=s3,
                  scheduler_client=scheduler_client,
                  scheduler_target=target,
                  scheduled_local=scheduled.strftime('%Y-%m-%dT%H:%M:%S'),
                  timezone_name='UTC',
                  caption_override=None,
                  options_json='{}',
              )
              v=asdict(result)
              expected=plan[post]
              if v['state']!='scheduled' or v['scheduled_at_utc']!=expected:
                  raise RuntimeError(f'post {post} schedule mismatch: {v}')
              es=scheduler_client.get_schedule(Name=v['schedule_name'],GroupName='eirepolitic-instagram')
              if es.get('State')!='ENABLED':
                  raise RuntimeError(f'post {post} EventBridge state {es.get("State")}')
              created.append({'post':post,'scheduled_at_utc':expected,'publication_id':v['publication_id'],'asset_package_id':v['asset_package_id'],'schedule_name':v['schedule_name'],'eventbridge_state':es.get('State')})
              print('scheduled corrected Second Stage post',post,expected)

          if len(created)!=23:
              raise RuntimeError(f'expected 23 replacement schedules, got {len(created)}')

          # Final collision audit across all currently scheduled publications.
          resp=table.query(
              IndexName='state-scheduled_at-index',
              KeyConditionExpression='#state = :state',
              ExpressionAttributeNames={'#state':'state'},
              ExpressionAttributeValues={':state':'scheduled'},
              ScanIndexForward=True,
          )
          final_items=resp.get('Items',[])
          while resp.get('LastEvaluatedKey'):
              resp=table.query(
                  IndexName='state-scheduled_at-index',
                  KeyConditionExpression='#state = :state',
                  ExpressionAttributeNames={'#state':'state'},
                  ExpressionAttributeValues={':state':'scheduled'},
                  ScanIndexForward=True,
                  ExclusiveStartKey=resp['LastEvaluatedKey'],
              )
              final_items.extend(resp.get('Items',[]))
          by_time={}
          for item in final_items:
              sch=item.get('schedule') or {}; ts=sch.get('scheduled_at_utc') or item.get('scheduled_at_utc')
              if not ts: continue
              by_time.setdefault(ts,[]).append({'publication_id':item.get('publication_id'),'project_id':(item.get('request') or {}).get('project_id')})
          collisions={ts:vals for ts,vals in by_time.items() if len(vals)>1}
          if collisions:
              raise SystemExit(f'schedule collisions remain after reschedule: {collisions}')

          audit={
              'cancelled_count':len(cancelled),
              'created_count':len(created),
              'morning_occupancy_preserved':sorted(morning_occupancy,key=lambda x:x['time']),
              'replacement_schedule':created,
              'collision_count':0,
              'first_second_stage_slot':created[0]['scheduled_at_utc'],
              'last_second_stage_slot':created[-1]['scheduled_at_utc'],
          }
          Path('reschedule-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'cancelled':len(cancelled),'created':len(created),'collisions':0,'first':created[0]['scheduled_at_utc'],'last':created[-1]['scheduled_at_utc']},indent=2))
          PY
      - name: Publish reschedule audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir audit && cp reschedule-audit.json audit/
          python - <<'PY'
          import json,html
          from pathlib import Path
          a=json.loads(Path('reschedule-audit.json').read_text(encoding='utf-8'))
          parts=['<!doctype html><meta charset="utf-8"><title>Second Stage corrected schedule</title><body style="max-width:1100px;margin:40px auto;padding:0 20px;font-family:Arial;background:#0f2f24;color:#f4ead7"><h1>Second Stage corrected schedule</h1>',f'<p>Old Second Stage schedules cancelled: {a["cancelled_count"]}. Corrected schedules created: {a["created_count"]}. Remaining collisions: {a["collision_count"]}.</p>','<table border="1" cellpadding="8" cellspacing="0"><tr><th>Post</th><th>Scheduled UTC</th><th>EventBridge</th></tr>']
          for r in a['replacement_schedule']:
              parts.append(f'<tr><td>{r["post"]}</td><td>{html.escape(r["scheduled_at_utc"])}</td><td>{html.escape(r["eventbridge_state"])}</td></tr>')
          parts.append('</table></body>'); Path('audit/index.html').write_text(''.join(parts),encoding='utf-8')
          PY
          cd audit
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . && git commit -m "audit: corrected Second Stage schedule ${GITHUB_RUN_ID}"
          git branch -M previews/bill-tracker-second-stage-corrected-schedule-audit
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/previews/bill-tracker-second-stage-corrected-schedule-audit
