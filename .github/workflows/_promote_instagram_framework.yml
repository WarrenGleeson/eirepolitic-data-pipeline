name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  AWS_REGION: us-east-2

jobs:
  inspect-approved-artifact:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/schedule-september-party-series-20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director AWS administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name instagram-inspect-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - run: python -m pip install --quiet boto3
      - name: Download approved artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p approved_artifact
          gh api repos/eirepolitic/Eirepolitic-data-pipeline/actions/artifacts/12066789630/zip > approved_artifact.zip
          unzip -q approved_artifact.zip -d approved_artifact
      - name: Inspect artifact and current inventory
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-runtime-support --query "Stacks[0].Outputs[?OutputKey=='ApprovedAssetsBucketName'].OutputValue | [0]" --output text)"
          function_arn="$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)"
          dlq_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)"
          FUNCTION_ARN="$function_arn" ROLE_ARN="$role_arn" DLQ_ARN="$dlq_arn" python - <<'PY'
          import json, os
          from dataclasses import asdict
          from pathlib import Path
          import boto3
          from publishing.schedule_inventory import list_upcoming_scheduled_publications
          from publishing.scheduler import SchedulerTarget

          artifact=Path('approved_artifact')
          handoffs=list(artifact.rglob('publication_handoff.json'))
          files=[str(p.relative_to(artifact)) for p in sorted(artifact.rglob('*')) if p.is_file()]
          handoff_data=[]
          for p in handoffs:
              payload=json.loads(p.read_text(encoding='utf-8'))
              handoff_data.append({
                  'path':str(p.relative_to(artifact)),
                  'root':str(p.parent.relative_to(artifact)),
                  'keys':sorted(payload.keys()),
                  'project_id':payload.get('project_id'),
                  'period_key':payload.get('period_key'),
                  'qa_all_passed':payload.get('qa_all_passed'),
                  'factory_publication_enabled':payload.get('factory_publication_enabled'),
                  'slide_count':len(payload.get('slides') or []),
                  'slides':payload.get('slides') or [],
              })
          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          upcoming=list_upcoming_scheduled_publications(
              table=table,
              scheduler_client=boto3.client('scheduler',region_name='us-east-2'),
              scheduler_target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN']),
          )
          report={
              'handoffs':handoff_data,
              'files':files,
              'upcoming_schedule':[asdict(item) for item in upcoming],
          }
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/september_artifact_structure.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str),encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False,default=str))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/september_artifact_structure.json
          git commit -m 'chore: capture approved September artifact structure'
          git push origin HEAD:ops/schedule-september-party-series-20261016
