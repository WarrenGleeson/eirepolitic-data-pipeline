name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect-reviewed-zip-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/schedule-september-party-series-20261016
      - name: Download approved review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p approved_artifact
          gh api repos/eirepolitic/Eirepolitic-data-pipeline/actions/artifacts/12066789630/zip > approved_artifact.zip
          unzip -q approved_artifact.zip -d approved_artifact
      - name: Capture compact reviewed package structure
        run: |
          python - <<'PY'
          import json, zipfile
          from collections import defaultdict
          from pathlib import Path
          artifact=Path('approved_artifact')
          z=next(artifact.rglob('party-monthly-profile-v2-september-2026.zip'))
          with zipfile.ZipFile(z) as archive:
              names=archive.namelist()
              parties=defaultdict(list)
              manifests={}
              for name in names:
                  parts=Path(name).parts
                  if 'parties' in parts:
                      idx=parts.index('parties')
                      if len(parts)>idx+2:
                          key=parts[idx+1]
                          if '/slides/' in name and name.endswith('.png'):
                              parties[key].append(name)
                          if name.endswith('/manifest.json'):
                              payload=json.loads(archive.read(name).decode('utf-8'))
                              manifests[key]={
                                  'party':payload.get('party'),
                                  'display_party_name':payload.get('display_party_name'),
                                  'party_key':payload.get('party_key'),
                                  'qa':payload.get('qa'),
                                  'review_state':payload.get('review_state'),
                                  'publication_enabled':payload.get('publication_enabled'),
                              }
              compact={
                  'zip_file_count':len(names),
                  'party_count':len(parties),
                  'parties':{
                      key:{'slides':sorted(value),'manifest':manifests.get(key)}
                      for key,value in sorted(parties.items())
                  },
              }
          Path('diagnostics/september_reviewed_zip_compact.json').write_text(json.dumps(compact,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Commit compact diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/september_reviewed_zip_compact.json
          git commit -m 'chore: capture compact reviewed September zip structure'
          git push origin HEAD:ops/schedule-september-party-series-20261016
