name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-september-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      OIREACHTAS_PUBLISH_ENABLED: 'true'
      OIREACHTAS_PUBLISH_LATEST: 'true'
      BATCH_ID: scheduled-weekly-37154732444-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oireachtas-orchestrator-startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Promote validated candidate through production guardrails
        run: |
          set -euo pipefail
          python process/oireachtas_batch_control.py promote --batch-id "$BATCH_ID" | tee promotion.json
      - name: Verify production pointer
        run: |
          set -euo pipefail
          python process/oireachtas_batch_control.py status | tee status.json
          python - <<'PY'
          import json
          status=json.load(open('status.json'))
          prod=status.get('production') or {}
          expected='scheduled-weekly-37154732444-1'
          actual=str(prod.get('batch_id') or '')
          if actual != expected:
              raise SystemExit(f'production pointer mismatch: expected {expected}, got {actual}')
          print(f'production pointer verified: {actual}')
          PY
