name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytical-layout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/party-speech-chart-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run Party Speech Breakdown visual regression tests
        run: |
          python -m pytest -q \
            tests/test_instagram_monthly_post_framework.py \
            tests/test_party_speech_analytical_layout.py \
            tests/test_instagram_review_email.py
