name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mockup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      S3_BUCKET: eirepolitic-data
      REVIEW_PREFIX: processed/instagram/party_issue_monthly_profile_v2/period=2026-09/source_batch=scheduled-weekly-37154732444-1/github_run=38085837142
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/party-cover-top-issue-mockup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 pillow
      - name: Build mockup from approved September cover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          import boto3
          from PIL import Image, ImageDraw, ImageFont

          bucket=os.environ['S3_BUCKET']
          prefix=os.environ['REVIEW_PREFIX'].rstrip('/')
          party_key='aontu'
          s3=boto3.client('s3', region_name='us-east-2')

          cover_key=f"{prefix}/parties/{party_key}/slides/01_cover.png"
          manifest_key=f"{prefix}/parties/{party_key}/manifest.json"
          cover=Image.open(io.BytesIO(s3.get_object(Bucket=bucket, Key=cover_key)['Body'].read())).convert('RGB')
          manifest=json.loads(s3.get_object(Bucket=bucket, Key=manifest_key)['Body'].read().decode('utf-8'))
          top=(manifest.get('raw_counts') or [])[0]
          issue=str(top.get('label') or top.get('canonical_label') or 'Top issue')
          count=int(top.get('value') or 0)

          def find_font(bold=False):
              candidates = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',
              ]
              for path in candidates:
                  if Path(path).exists():
                      return path
              raise RuntimeError('No suitable font found')

          draw=ImageDraw.Draw(cover)
          accent='#d8b45f'; text='#f4ead7'; bg='#0f2f24'
          label_font=ImageFont.truetype(find_font(True), 22)
          issue_font=ImageFont.truetype(find_font(True), 42)

          # Clean, centered callout in the unused space between title rule and logo.
          label='MOST DISCUSSED ISSUE'
          draw.text((540, 215), label, font=label_font, fill=accent, anchor='mm')

          # Fit issue to one line where possible; otherwise split across two lines.
          max_width=780
          size=42
          while size >= 30:
              issue_font=ImageFont.truetype(find_font(True), size)
              bbox=draw.textbbox((0,0), issue, font=issue_font)
              if bbox[2]-bbox[0] <= max_width:
                  break
              size -= 2
          if draw.textbbox((0,0), issue, font=issue_font)[2] <= max_width:
              draw.text((540, 264), issue, font=issue_font, fill=text, anchor='mm')
          else:
              words=issue.split()
              split=max(1, len(words)//2)
              lines=[' '.join(words[:split]), ' '.join(words[split:])]
              draw.multiline_text((540, 254), '\n'.join(lines), font=issue_font, fill=text, anchor='mm', align='center', spacing=2)

          out=Path('instagram/mockups/party_cover_top_issue')
          out.mkdir(parents=True, exist_ok=True)
          mock=out/'aontu_september_2026_top_issue_mockup.png'
          cover.save(mock)
          metadata={
              'party':'Aontú',
              'period':'2026-09',
              'top_issue':issue,
              'top_issue_speech_count':count,
              'source_review_run_id':38085837142,
              'production_changed':False,
              'mockup_only':True,
              'callout':{
                  'label':'MOST DISCUSSED ISSUE',
                  'label_y':215,
                  'issue_y':264,
                  'label_color':accent,
                  'issue_color':text,
              }
          }
          (out/'aontu_september_2026_top_issue_mockup.json').write_text(json.dumps(metadata,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(metadata,indent=2,ensure_ascii=False))
          PY
      - name: Commit mockup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add instagram/mockups/party_cover_top_issue/
          git commit -m 'design(instagram): mock up top issue on Party Speech Breakdown cover'
          git push origin HEAD:design/party-cover-top-issue-mockup
