name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-instagram-email-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-email-approval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile approval runtime
        run: python -m compileall -q instagram publishing
      - name: Run Instagram approval and recurring regression tests
        run: |
          python -m pytest -q \
            tests/test_instagram_monthly_post_framework.py \
            tests/test_party_speech_analytical_layout.py \
            tests/test_instagram_party_cover_top_issue.py \
            tests/test_instagram_review_email.py \
            tests/test_instagram_review_approval.py
