name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  AWS_REGION: us-east-2

jobs:
  schedule-reviewed-september-party-series:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/schedule-september-party-series-20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director AWS administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name instagram-schedule-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install --quiet boto3 pillow
      - name: Download and extract approved September review package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p approved_artifact reviewed_package
          gh api repos/eirepolitic/Eirepolitic-data-pipeline/actions/artifacts/12066789630/zip > approved_artifact.zip
          unzip -q approved_artifact.zip -d approved_artifact
          reviewed_zip="$(find approved_artifact -name party-monthly-profile-v2-september-2026.zip -type f -print -quit)"
          test -n "$reviewed_zip" || { echo "reviewed September ZIP not found"; exit 1; }
          unzip -q "$reviewed_zip" -d reviewed_package
      - name: Resolve publishing infrastructure
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-runtime-support --query "Stacks[0].Outputs[?OutputKey=='ApprovedAssetsBucketName'].OutputValue | [0]" --output text)"
          function_arn="$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)"
          dlq_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)"
          echo "BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "FUNCTION_ARN=$function_arn" >> "$GITHUB_ENV"
          echo "ROLE_ARN=$role_arn" >> "$GITHUB_ENV"
          echo "DLQ_ARN=$dlq_arn" >> "$GITHUB_ENV"
      - name: Cancel orphaned long-id publication from failed attempt
        run: |
          python - <<'PY'
          import json
          import boto3
          from publishing.control import PublicationControlService
          from publishing.dynamodb_ledger import DynamoDBPublicationLedger
          from publishing.ledger import LedgerNotFound

          publication_id='ig-party-issue-monthly-profile-v2-2026-09-38949142923-100-rdr'
          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          control=PublicationControlService(DynamoDBPublicationLedger(table))
          result={'publication_id':publication_id,'action':'none'}
          try:
              record=control.get(publication_id)
              result['state_before']=record.state
              if record.state in {'approved','scheduled'}:
                  cancelled=control.cancel(publication_id)
                  result['action']='cancelled'
                  result['state_after']=cancelled.state
              else:
                  result['state_after']=record.state
          except LedgerNotFound:
              result['action']='not_found'
          print(json.dumps(result,indent=2))
          PY
      - name: Verify reviewed package and all 11 target slots
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path
          import boto3
          from publishing.schedule_inventory import list_upcoming_scheduled_publications
          from publishing.scheduler import SchedulerTarget

          root=Path('reviewed_package')
          party_dirs=sorted(p for p in (root/'parties').iterdir() if p.is_dir())
          if len(party_dirs)!=11:
              raise SystemExit(f'Expected 11 party directories, found {len(party_dirs)}')
          for party_dir in party_dirs:
              slides=sorted((party_dir/'slides').glob('*.png'))
              manifest=json.loads((party_dir/'manifest.json').read_text(encoding='utf-8'))
              if len(slides)!=5:
                  raise SystemExit(f'{party_dir.name}: expected 5 slides, found {len(slides)}')
              if manifest.get('qa') != {'passed':5,'failed':0}:
                  raise SystemExit(f'{party_dir.name}: party QA is not 5/5: {manifest.get("qa")}')
              if manifest.get('publication_enabled') is not False:
                  raise SystemExit(f'{party_dir.name}: factory publication guard is not false')

          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          upcoming=list_upcoming_scheduled_publications(
              table=table,
              scheduler_client=boto3.client('scheduler',region_name='us-east-2'),
              scheduler_target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN']),
          )
          targets={(date(2026,10,17)+timedelta(days=i)).isoformat()+'T08:00:00' for i in range(11)}
          conflicts=[]
          for item in upcoming:
              value=str(item.scheduled_at_utc).replace('Z','').replace('+00:00','')
              if value in targets:
                  conflicts.append({'publication_id':item.publication_id,'scheduled_at_utc':item.scheduled_at_utc})
          if conflicts:
              raise SystemExit(f'Target 08:00 UTC slots are no longer clear: {conflicts}')
          print('Reviewed package verified; all 11 target slots are clear.')
          PY
      - name: Schedule 11 reviewed party carousels
        run: |
          python - <<'PY'
          import json, os, shutil
          from datetime import date, timedelta
          from pathlib import Path
          import boto3
          from publishing.scheduler import SchedulerTarget
          from publishing.standard_pipeline import prepare_standard_publication

          root=Path('reviewed_package')
          rows=[]
          for party_dir in (root/'parties').iterdir():
              if not party_dir.is_dir():
                  continue
              manifest=json.loads((party_dir/'manifest.json').read_text(encoding='utf-8'))
              slides=sorted((party_dir/'slides').glob('*.png'))
              rows.append((str(manifest.get('display_party_name') or manifest.get('party')), party_dir.name, slides))
          rows.sort(key=lambda row: row[0].casefold())
          if len(rows)!=11:
              raise SystemExit(f'Expected 11 party rows, found {len(rows)}')

          s3=boto3.client('s3',region_name='us-east-2')
          dynamodb=boto3.resource('dynamodb',region_name='us-east-2')
          scheduler_client=boto3.client('scheduler',region_name='us-east-2')
          target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN'])
          out_root=Path('publication_packages'); out_root.mkdir(exist_ok=True)
          results=[]; start=date(2026,10,17)

          for index,(display,party_key,slides) in enumerate(rows, start=1):
              scheduled_date=start+timedelta(days=index-1)
              package_root=out_root/party_key
              slide_entries=[]
              for slide in slides:
                  rel=Path('slides')/slide.name
                  dst=package_root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(slide,dst)
                  slide_entries.append({'path':str(rel).replace('\\','/'),'party_key':party_key})
              handoff={'schema_version':1,'project_id':'party_issue_monthly_profile_v2','period_key':'2026-09','qa_all_passed':True,'factory_publication_enabled':False,'slides':slide_entries}
              package_root.mkdir(parents=True,exist_ok=True)
              (package_root/'publication_handoff.json').write_text(json.dumps(handoff,indent=2),encoding='utf-8')
              caption=(
                  f"Our Party Speech Breakdown looks at the issues discussed by {display} in Dáil speeches during September 2026.\n\n"
                  "Swipe through to see:\n\n"
                  "• their most discussed issues\n"
                  "• the issues they discussed more than the average across parties\n"
                  "• the issues they discussed more than average per TD\n\n"
                  "These figures measure how often issues were discussed, not the party’s position on them.\n\n"
                  "#EirePolitic #Oireachtas #IrishPolitics #DáilÉireann #PoliticalData"
              )
              short_id=f'p{index:02d}'
              result=prepare_standard_publication(
                  artifact_root=package_root,
                  factory_run_id=short_id,
                  approved_by='User approval in ChatGPT on 2026-10-16',
                  mode='scheduled',
                  bucket=os.environ['BUCKET'],
                  dynamodb_resource=dynamodb,
                  s3_client=s3,
                  scheduler_client=scheduler_client,
                  scheduler_target=target,
                  scheduled_local=f'{scheduled_date.isoformat()}T08:00:00',
                  timezone_name='UTC',
                  caption_override=caption,
                  options_json='{}',
              )
              row={
                  'date_utc':scheduled_date.isoformat(),
                  'time_utc':'08:00',
                  'party':display,
                  'party_key':party_key,
                  'short_id':short_id,
                  'publication_id':result.publication_id,
                  'state':result.state,
                  'scheduled_at_utc':result.scheduled_at_utc,
                  'schedule_name':result.schedule_name,
              }
              results.append(row)
              print(json.dumps(row,ensure_ascii=False))
          Path('scheduled_party_series.json').write_text(json.dumps(results,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Verify all 11 schedules in live inventory
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import boto3
          from publishing.schedule_inventory import list_upcoming_scheduled_publications
          from publishing.scheduler import SchedulerTarget

          expected=json.loads(Path('scheduled_party_series.json').read_text(encoding='utf-8'))
          if len(expected)!=11 or any(row['state']!='scheduled' for row in expected):
              raise SystemExit(f'Expected 11 scheduled rows: {expected}')
          table=boto3.resource('dynamodb',region_name='us-east-2').Table('eirepolitic-publications')
          upcoming=list_upcoming_scheduled_publications(
              table=table,
              scheduler_client=boto3.client('scheduler',region_name='us-east-2'),
              scheduler_target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN']),
          )
          by_id={item.publication_id:item for item in upcoming}
          verified=[]
          for index,row in enumerate(expected):
              item=by_id.get(row['publication_id'])
              if item is None:
                  raise SystemExit(f'Missing from live inventory: {row["publication_id"]}')
              if item.verification_status!='verified':
                  raise SystemExit(f'Unverified schedule: {row["publication_id"]} -> {item.verification_status}')
              expected_iso=f'2026-10-{17+index:02d}T08:00:00'
              actual=str(item.scheduled_at_utc).replace('Z','').replace('+00:00','')
              if actual!=expected_iso:
                  raise SystemExit(f'Time mismatch for {row["publication_id"]}: {item.scheduled_at_utc} != {expected_iso} UTC')
              verified.append({**row,'verification_status':item.verification_status})
          Path('verified_party_series.json').write_text(json.dumps(verified,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(verified,indent=2,ensure_ascii=False))
          PY
      - name: Commit verified schedule evidence
        run: |
          mkdir -p diagnostics
          cp verified_party_series.json diagnostics/september_2026_party_series_schedule.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/september_2026_party_series_schedule.json
          git commit -m 'chore: record verified September party series schedule'
          git push origin HEAD:ops/schedule-september-party-series-20261016
