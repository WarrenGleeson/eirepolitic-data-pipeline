name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-ses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ses-instagram-review-email
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Probe SES with exception capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          import boto3

          report={"region":"us-east-2"}
          try:
              sts=boto3.client('sts',region_name='us-east-2')
              report['caller_identity']=sts.get_caller_identity()
          except Exception as e:
              report['sts_exception']={"type":type(e).__name__,"message":str(e),"traceback":traceback.format_exc()}
          try:
              ses=boto3.client('sesv2',region_name='us-east-2')
              report['ses_account']=ses.get_account()
          except Exception as e:
              report['ses_account_exception']={"type":type(e).__name__,"message":str(e),"traceback":traceback.format_exc()}
          try:
              ses=boto3.client('sesv2',region_name='us-east-2')
              report['ses_identities']=ses.list_email_identities(PageSize=100).get('EmailIdentities',[])
          except Exception as e:
              report['ses_identities_exception']={"type":type(e).__name__,"message":str(e),"traceback":traceback.format_exc()}

          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/ses_us_east_2_probe.json').write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
          print(json.dumps(report,indent=2,default=str))
          PY
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/ses_us_east_2_probe.json
          git commit -m 'chore: capture SES us-east-2 probe details'
          git push origin HEAD:feature/ses-instagram-review-email
