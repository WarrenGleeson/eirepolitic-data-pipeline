name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-approval-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-email-approval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile and test
        run: |
          python -m compileall -q instagram publishing
          python -m pytest -q \
            tests/test_instagram_monthly_post_framework.py \
            tests/test_party_speech_analytical_layout.py \
            tests/test_instagram_party_cover_top_issue.py \
            tests/test_instagram_review_email.py \
            tests/test_instagram_review_approval.py

  audit-generator-dynamodb-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-email-approval
      - name: Audit current generator principal and DynamoDB permissions
        shell: bash
        run: |
          set -euo pipefail
          identity="$(aws sts get-caller-identity --output json)"
          arn="$(python -c 'import json,sys; print(json.load(sys.stdin)["Arn"])' <<< "$identity")"
          account="$(python -c 'import json,sys; print(json.load(sys.stdin)["Account"])' <<< "$identity")"
          table_arn="arn:aws:dynamodb:us-east-2:${account}:table/eirepolitic-publications"

          set +e
          sim="$(aws iam simulate-principal-policy \
            --policy-source-arn "$arn" \
            --action-names dynamodb:GetItem dynamodb:PutItem dynamodb:UpdateItem \
            --resource-arns "$table_arn" \
            --output json 2>simulation.err)"
          sim_status=$?
          set -e

          get_status=0
          aws dynamodb get-item \
            --table-name eirepolitic-publications \
            --key '{"pk":{"S":"PERMISSION-PROBE"},"sk":{"S":"CONTROL"}}' \
            --consistent-read \
            --output json >/tmp/get.json 2>/tmp/get.err || get_status=$?

          PRINCIPAL_ARN="$arn" SIM_STATUS="$sim_status" SIM_RESULT="$sim" GET_STATUS="$get_status" python - <<'PY'
          import json, os
          from pathlib import Path
          report={
              'principal_arn':os.environ['PRINCIPAL_ARN'],
              'get_item_probe_succeeded':os.environ['GET_STATUS']=='0',
              'simulation_supported':os.environ['SIM_STATUS']=='0',
          }
          if report['simulation_supported']:
              payload=json.loads(os.environ['SIM_RESULT'])
              report['actions']={row['EvalActionName']:row['EvalDecision'] for row in payload.get('EvaluationResults',[])}
          else:
              report['simulation_error']=Path('simulation.err').read_text(encoding='utf-8',errors='replace')[:2000]
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/instagram_generator_permission_audit.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit permission audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/instagram_generator_permission_audit.json
          git commit -m 'chore: capture Instagram generator permission audit'
          git push origin HEAD:feature/instagram-email-approval
