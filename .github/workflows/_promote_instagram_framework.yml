name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-separator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/party-speech-cover-top-issue
      - name: Replace cover issue separator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('instagram/projects/party_issue_monthly_profile_v2/adapter.py')
          text=path.read_text(encoding='utf-8')
          old='display_text = f"{most_discussed} & {more_than_average}" if include_second else most_discussed'
          new='display_text = f"{most_discussed} + {more_than_average}" if include_second else most_discussed'
          if old not in text:
              raise SystemExit('Expected ampersand separator expression not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add instagram/projects/party_issue_monthly_profile_v2/adapter.py
          git commit -m 'feat(instagram): use plus separator for cover issues'
          git push origin HEAD:feature/party-speech-cover-top-issue
