name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-test-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/party-speech-chart-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml pillow requests
      - name: Capture pytest output
        shell: bash
        run: |
          set +e
          python -m pytest -vv tests/test_party_speech_analytical_layout.py --tb=short > /tmp/test.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/test.log
          mkdir -p diagnostics/instagram
          cp /tmp/test.log diagnostics/instagram/analytical_layout_test.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/instagram/analytical_layout_test.log
          git commit -m 'chore: capture analytical layout test diagnostics'
          git push origin HEAD:fix/party-speech-chart-composition
          exit "$STATUS"
