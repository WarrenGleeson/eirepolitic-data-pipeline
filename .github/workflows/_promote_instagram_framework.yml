name: Promote approved Instagram framework assets

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  validate-final-approval-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-email-approval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile and test
        run: |
          python -m compileall -q instagram publishing
          python -m pytest -q \
            tests/test_instagram_monthly_post_framework.py \
            tests/test_party_speech_analytical_layout.py \
            tests/test_instagram_party_cover_top_issue.py \
            tests/test_instagram_review_email.py \
            tests/test_instagram_review_approval.py

  probe-generator-approval-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - name: Verify monthly extractor can write only the S3 approval registry path
        shell: bash
        run: |
          set -euo pipefail
          key="processed/instagram/review_approvals/permission-probe/github-run-${GITHUB_RUN_ID}.json"
          trap 'aws s3 rm "s3://eirepolitic-data/$key" --only-show-errors >/dev/null 2>&1 || true' EXIT
          printf '{"probe":true,"run_id":"%s"}\n' "$GITHUB_RUN_ID" | aws s3 cp - "s3://eirepolitic-data/$key" --content-type application/json --only-show-errors
          aws s3api head-object --bucket eirepolitic-data --key "$key" >/dev/null
          aws s3 rm "s3://eirepolitic-data/$key" --only-show-errors
          trap - EXIT
          echo "Generator S3 approval-registry write/delete probe: PASS"

  deploy-refactored-approval-backend:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 30
    env:
      REVIEW_EMAIL: ${{ vars.INSTAGRAM_REVIEW_EMAIL }}
      REVIEW_FROM: ${{ vars.INSTAGRAM_REVIEW_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instagram-email-approval
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director AWS administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name instagram-review-approval-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Validate templates
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/publishing/approval_support.yml >/dev/null
          aws cloudformation validate-template --template-body file://infra/publishing/approval_receiving.yml >/dev/null
      - name: Resolve infrastructure
        run: |
          set -euo pipefail
          approved_bucket="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-runtime-support --query "Stacks[0].Outputs[?OutputKey=='ApprovedAssetsBucketName'].OutputValue | [0]" --output text)"
          publisher_arn="$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)"
          scheduler_role="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)"
          scheduler_dlq="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)"
          echo "APPROVED_BUCKET=$approved_bucket" >> "$GITHUB_ENV"
          echo "PUBLISHER_ARN=$publisher_arn" >> "$GITHUB_ENV"
          echo "SCHEDULER_ROLE=$scheduler_role" >> "$GITHUB_ENV"
          echo "SCHEDULER_DLQ=$scheduler_dlq" >> "$GITHUB_ENV"
      - name: Package approval Lambda
        run: |
          set -euo pipefail
          rm -rf approval-lambda-package approval-lambda-package.zip
          mkdir -p approval-lambda-package/publishing
          cp publishing/*.py approval-lambda-package/publishing/
          python -m pip install --quiet --target approval-lambda-package --only-binary=:all: pillow
          (cd approval-lambda-package && zip -qr ../approval-lambda-package.zip .)
          code_key="lambda-packages/instagram-review-approval/${GITHUB_SHA}.zip"
          aws s3 cp approval-lambda-package.zip "s3://${APPROVED_BUCKET}/${code_key}" --only-show-errors
          echo "CODE_KEY=$code_key" >> "$GITHUB_ENV"
      - name: Deploy approval Lambda update
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name eirepolitic-instagram-review-approval --template-file infra/publishing/approval_support.yml --capabilities CAPABILITY_NAMED_IAM --parameter-overrides CodeS3Bucket="$APPROVED_BUCKET" CodeS3Key="$CODE_KEY" ApprovedAssetsBucketName="$APPROVED_BUCKET" SourceReviewBucketName=eirepolitic-data ApprovalRegistryPrefix=processed/instagram/review_approvals PublicationsTableName=eirepolitic-publications PublisherLambdaArn="$PUBLISHER_ARN" SchedulerExecutionRoleArn="$SCHEDULER_ROLE" SchedulerDeadLetterQueueArn="$SCHEDULER_DLQ" ApprovedReviewerEmail="$REVIEW_EMAIL" ConfirmationFrom="$REVIEW_FROM" --no-fail-on-empty-changeset --no-cli-pager
      - name: Verify approval Lambda update
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name eirepolitic-instagram-review-approval --query '{State:State,LastUpdateStatus:LastUpdateStatus,Handler:Handler,Environment:Environment.Variables}' --no-cli-pager
