name: Schedule approved recorded voting participation posts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  schedule:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name director-voting-schedule-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Schedule and verify three approved posts
        env:
          SESSION_ROOT: director/sessions/2026-09-27-recorded-voting-participation
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3 pillow
          bucket="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-runtime-support --query "Stacks[0].Outputs[?OutputKey=='ApprovedAssetsBucketName'].OutputValue | [0]" --output text)"
          function_arn="$(aws lambda get-function --function-name eirepolitic-instagram-publisher --query 'Configuration.FunctionArn' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerExecutionRoleArn'].OutputValue | [0]" --output text)"
          dlq_arn="$(aws cloudformation describe-stacks --stack-name eirepolitic-instagram-scheduler-support --query "Stacks[0].Outputs[?OutputKey=='SchedulerDeadLetterQueueArn'].OutputValue | [0]" --output text)"
          BUCKET="$bucket" FUNCTION_ARN="$function_arn" ROLE_ARN="$role_arn" DLQ_ARN="$dlq_arn" python - <<'PY'
          import json, os, shutil
          from datetime import datetime, timezone
          from dataclasses import asdict
          from pathlib import Path
          import boto3
          from publishing.scheduler import SchedulerTarget
          from publishing.standard_pipeline import prepare_standard_publication

          repo = Path.cwd()
          session = repo / os.environ['SESSION_ROOT']
          manifest = json.loads((session / 'split_posts_review/manifest.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'PASS' and manifest['computer_visual_qa']['pass']
          assert manifest['publication_enabled'] is False
          assert manifest['td_exclusions'] == ['Verona Murphy']
          assert manifest['period']['start'] == '2026-04-06' and manifest['period']['end'] == '2026-10-06'
          assert len(manifest['posts']) == 3

          captions = {
            'tds': """How often did TDs have a recorded vote or formal abstention when they were eligible to participate in a Dáil division?

This post looks at recorded voting participation across individual TDs over the six-month review period, including those with a recorded participation rate of 100%, the highest rates below 100%, and the lowest rates.

Swipe through for the figures, how the metric is calculated, and the important limitations behind the data.

Recorded voting participation does not by itself measure a TD’s attendance, workload, effectiveness, or overall job performance.

#EirePolitic #Oireachtas #IrishPolitics #DáilÉireann #TDs""",
            'constituencies': """How did recorded voting participation compare across Dáil constituencies?

This post combines the eligible voting opportunities of TDs within each constituency and shows the constituencies with the highest and lowest recorded-participation percentages during the review period.

Swipe through for the figures, how the constituency percentages are calculated, and the methodology behind the comparison.

Recorded voting participation does not by itself measure a TD’s attendance, workload, effectiveness, or overall job performance.

#EirePolitic #Oireachtas #IrishPolitics #DáilÉireann #Constituencies""",
            'parties': """How did recorded voting participation compare across parties and parliamentary groups?

This post combines the eligible voting opportunities of TDs by their party or group at the time of each division and shows the highest and lowest recorded-participation percentages during the review period.

Swipe through for the figures, how the percentages are calculated, and the methodology behind the comparison.

Recorded voting participation does not by itself measure a TD’s attendance, workload, effectiveness, or overall job performance.

#EirePolitic #Oireachtas #IrishPolitics #DáilÉireann #IrishPoliticsData""",
          }
          plan = [('tds','TDs','2026-10-20T15:00:00'),('constituencies','Constituencies','2026-10-21T15:00:00'),('parties','Parties','2026-10-22T15:00:00')]
          by_kind = {p['kind']:p for p in manifest['posts']}
          now = datetime.now(timezone.utc)
          for key,kind,when in plan:
              at = datetime.fromisoformat(when).replace(tzinfo=timezone.utc)
              if at <= now:
                  raise RuntimeError(f'Scheduled time is no longer in future: {when}')
              post = by_kind[kind]
              expected = 5 if key == 'tds' else 4
              if len(post['slides']) != expected:
                  raise RuntimeError(f'Unexpected slide count for {kind}')
              for slide in post['slides']:
                  if not (repo / slide).is_file():
                      raise RuntimeError(f'Missing slide {slide}')

          db = boto3.resource('dynamodb',region_name='us-east-2')
          table = db.Table('eirepolitic-publications')
          items=[]; kwargs={}
          while True:
              response=table.scan(**kwargs)
              items.extend(response.get('Items',[]))
              if 'LastEvaluatedKey' not in response: break
              kwargs['ExclusiveStartKey']=response['LastEvaluatedKey']
          planned = {when+'Z' for _,_,when in plan}
          for item in items:
              if item.get('entity_type') != 'publication_control': continue
              if item.get('state') in {'cancelled','failed','published'}: continue
              when = item.get('scheduled_at_utc') or (item.get('schedule') or {}).get('scheduled_at_utc')
              if when in planned:
                  raise RuntimeError(f'Existing active post at {when}: {item.get("publication_id")}')

          s3=boto3.client('s3',region_name='us-east-2')
          scheduler=boto3.client('scheduler',region_name='us-east-2')
          target=SchedulerTarget(lambda_arn=os.environ['FUNCTION_ARN'],role_arn=os.environ['ROLE_ARN'],dlq_arn=os.environ['DLQ_ARN'])
          results=[]
          for key,kind,when in plan:
              root=repo/'artifacts/director-recorded-voting-publish'/key
              root.mkdir(parents=True,exist_ok=True)
              for idx,src in enumerate(by_kind[kind]['slides'],1):
                  shutil.copy2(repo/src,root/f'{idx:02d}.png')
              (root/'caption.txt').write_text(captions[key]+'\n',encoding='utf-8')
              handoff={'schema_version':1,'project_id':'recorded_voting_participation_'+key,'period_key':'2026-04-06_2026-10-06','qa_all_passed':True,'factory_publication_enabled':False,'slides':[{'path':f'{idx:02d}.png'} for idx in range(1,len(by_kind[kind]['slides'])+1)],'caption_path':'caption.txt'}
              (root/'publication_handoff.json').write_text(json.dumps(handoff,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              result=prepare_standard_publication(artifact_root=root,factory_run_id='director-recorded-voting-'+key+'-20261020',approved_by='warrengleeson',mode='scheduled',bucket=os.environ['BUCKET'],dynamodb_resource=db,s3_client=s3,scheduler_client=scheduler,scheduler_target=target,scheduled_local=when,timezone_name='UTC')
              row=asdict(result); row['kind']=kind; results.append(row)
              print(json.dumps(row,ensure_ascii=False))
          out=session/'publishing_review/recorded_voting_scheduled_publications.json'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'status':'PASS','publications':results},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist scheduling receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-09-27-recorded-voting-participation/publishing_review/recorded_voting_scheduled_publications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist recorded voting participation scheduling receipt'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
