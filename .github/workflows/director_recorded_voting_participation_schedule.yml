name: Schedule approved recorded voting participation posts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  schedule:
    runs-on: ubuntu-latest
    environment: instagram-publishing
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sly/session/2026-09-27-recorded-voting-participation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INSTAGRAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INSTAGRAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Assume High Director administrator role
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          credentials="$(aws sts assume-role --role-arn "arn:aws:iam::${account_id}:role/HighDirectorAwsAdmin" --role-session-name director-voting-schedule-${GITHUB_RUN_ID} --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)"
          read -r access_key secret_key session_token <<< "$credentials"
          echo "::add-mask::$access_key"; echo "::add-mask::$secret_key"; echo "::add-mask::$session_token"
          echo "AWS_ACCESS_KEY_ID=$access_key" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret_key" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$session_token" >> "$GITHUB_ENV"
      - name: Run approved scheduling logic from review branch
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path('.github/workflows/director_recorded_voting_participation_schedule.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['schedule']['steps']
          for name in ('Schedule and verify three approved posts', 'Persist scheduling receipt'):
              step = next(s for s in steps if s.get('name') == name)
              env = os.environ.copy()
              env.update(step.get('env', {}))
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], env=env, check=True)
          PY
