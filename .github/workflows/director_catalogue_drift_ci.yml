name: Director catalogue drift check

on:
  push:
    branches: [main]
    paths:
      - "director/workflows.yml"
      - "director/projects.yml"
      - "instagram/projects/**/project.yml"
      - ".github/workflows/**"
      - "process/build_director_catalogue.py"
  pull_request:
    paths:
      - "director/workflows.yml"
      - "director/projects.yml"
      - "instagram/projects/**/project.yml"
      - ".github/workflows/**"
      - "process/build_director_catalogue.py"
  schedule:
    # Catches drift from a workflow being added/removed/retitled without
    # touching any path above (e.g. a new workflow file lands in the same
    # PR as something unrelated, or a workflow's display name is edited in
    # the GitHub UI). Once a day is enough for a knowledge tree, not a
    # production guardrail.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check director/ AUTO-GENERATED sections match live GitHub state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python process/build_director_catalogue.py --check
