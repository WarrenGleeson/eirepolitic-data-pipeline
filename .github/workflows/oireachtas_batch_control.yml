name: Oireachtas batch control
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        required: true
        type: choice
        options: [status, assemble, promote, rollback, rollback-previous]
        default: status
      batch_id:
        description: Required for assemble, promote, and rollback; use legacy_direct for first-cutover rollback
        required: false
        type: string
      required_tables:
        description: Optional comma-separated required tables for assemble
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: oireachtas-production-promotion
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      S3_BUCKET: eirepolitic-data
      DIRECTOR_VOTE_AUDIT_DIR: artifacts/director-recorded-voting-participation
      OIREACHTAS_PUBLISH_ENABLED: ${{ vars.OIREACHTAS_PUBLISH_ENABLED || 'false' }}
      OIREACHTAS_PUBLISH_LATEST: ${{ (inputs.operation == 'promote' || inputs.operation == 'rollback' || inputs.operation == 'rollback-previous') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate inputs
        env:
          OPERATION: ${{ inputs.operation }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" =~ ^(assemble|promote|rollback)$ && -z "${BATCH_ID}" ]]; then exit 2; fi
          if [[ -n "${BATCH_ID}" && ! "${BATCH_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then exit 2; fi
      - name: Run batch control
        env:
          OPERATION: ${{ inputs.operation }}
          BATCH_ID: ${{ inputs.batch_id }}
          REQUIRED_TABLES: ${{ inputs.required_tables }}
        run: |
          set -euo pipefail
          args=(--bucket "${S3_BUCKET}" --region "${AWS_REGION}" "${OPERATION}")
          if [[ "${OPERATION}" =~ ^(assemble|promote|rollback)$ ]]; then args+=(--batch-id "${BATCH_ID}"); fi
          python process/oireachtas_batch_control.py "${args[@]}" | tee oireachtas-batch-control.json
      - name: Run Director recorded-voting participation audit
        if: ${{ inputs.operation == 'status' }}
        run: python process/director_recorded_voting_participation_audit.py
      - name: Apply Ceann Comhairle office-holder correction
        if: ${{ inputs.operation == 'status' }}
        run: python process/director_recorded_voting_participation_ceann_fix.py
      - name: Render split review posts
        if: ${{ inputs.operation == 'status' }}
        run: |
          set -euo pipefail
          python process/director_recorded_voting_participation_split_posts.py
      - name: Build split-post contact sheets
        if: ${{ inputs.operation == 'status' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path("director/sessions/2026-09-27-recorded-voting-participation/split_posts_review")
          folders = ["tds", "constituencies", "parties"]
          bg = "#0f2f24"
          text = "#f4ead7"
          gold = "#d8b45f"
          thumb_w, thumb_h = 324, 405
          margin, gap, label_h = 30, 20, 48
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          label_font = ImageFont.truetype(font_path, 20) if Path(font_path).exists() else ImageFont.load_default()

          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          posts_by_folder = {
              post["kind"].lower().replace(" ", "_"): post
              for post in manifest.get("posts", [])
          }

          for folder_name in folders:
              folder = root / folder_name
              slides = sorted(folder.glob("[0-9][0-9]_*.png"))
              if not slides:
                  raise RuntimeError(f"No slides found in {folder}")
              expected = len(posts_by_folder.get(folder_name, {}).get("slides", slides))
              if len(slides) != expected:
                  raise RuntimeError(f"Expected {expected} slides in {folder}, found {len(slides)}")

              canvas_w = margin * 2 + thumb_w * len(slides) + gap * (len(slides) - 1)
              canvas_h = margin * 2 + thumb_h + label_h
              canvas = Image.new("RGB", (canvas_w, canvas_h), bg)
              draw = ImageDraw.Draw(canvas)
              for i, slide_path in enumerate(slides, start=1):
                  with Image.open(slide_path) as src:
                      thumb = src.convert("RGB").resize((thumb_w, thumb_h), Image.Resampling.LANCZOS)
                  x = margin + (i - 1) * (thumb_w + gap)
                  y = margin
                  canvas.paste(thumb, (x, y))
                  draw.rectangle((x, y + thumb_h + 8, x + thumb_w, y + thumb_h + 11), fill=gold)
                  label = f"Slide {i}"
                  box = draw.textbbox((0, 0), label, font=label_font)
                  tx = x + (thumb_w - (box[2] - box[0])) // 2
                  draw.text((tx, y + thumb_h + 17), label, font=label_font, fill=text)

              out = folder / "contact_sheet.png"
              canvas.save(out, quality=95)
              if folder_name in posts_by_folder:
                  posts_by_folder[folder_name]["contact_sheet"] = str(out)
              print(f"Wrote {out}")

          manifest["contact_sheets"] = {
              name: str(root / name / "contact_sheet.png") for name in folders
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Persist Director review evidence
        if: ${{ inputs.operation == 'status' }}
        run: |
          set -euo pipefail
          evidence_target="director/sessions/2026-09-27-recorded-voting-participation/evidence"
          mkdir -p "$evidence_target"
          cp -f artifacts/director-recorded-voting-participation/* "$evidence_target/"
          cp -f oireachtas-batch-control.json "$evidence_target/oireachtas-batch-control.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add director/sessions/2026-09-27-recorded-voting-participation
          if ! git diff --cached --quiet; then git commit -m "Persist split recorded voting participation review posts"; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Upload Director review artifact
        if: ${{ always() && inputs.operation == 'status' }}
        uses: actions/upload-artifact@v4
        with:
          name: director-recorded-voting-participation-${{ github.run_id }}
          path: director/sessions/2026-09-27-recorded-voting-participation/
          if-no-files-found: error
          retention-days: 30
