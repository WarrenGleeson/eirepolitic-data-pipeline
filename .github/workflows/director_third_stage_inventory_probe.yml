name: Director Third Stage inventory probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sly/session/2026-10-10-bill-tracker-third-stage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas boto3 pyyaml
      - name: Resolve pointer and inventory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          from instagram.factory.oireachtas_source import resolve_validated_production_batch, load_csv_tables

          session_id = '2026-10-10-bill-tracker-third-stage'
          out_dir = Path('director/sessions') / session_id
          out_dir.mkdir(parents=True, exist_ok=True)

          tables = [
              'silver_bills', 'silver_bill_stages', 'silver_bill_sponsors',
              'silver_bill_debates', 'silver_speeches', 'silver_divisions', 'silver_member_votes'
          ]
          batch = resolve_validated_production_batch()
          frames, lineage = load_csv_tables(batch, tables)
          bills = frames['silver_bills'].copy()
          stages = frames['silver_bill_stages'].copy()
          sponsors = frames['silver_bill_sponsors'].copy()
          bill_debates = frames['silver_bill_debates'].copy()
          speeches = frames['silver_speeches'].copy()
          divisions = frames['silver_divisions'].copy()
          member_votes = frames['silver_member_votes'].copy()

          # Production data model uses Committee Stage for parliamentary Third Stage.
          current_stage = stages[
              stages['stage_name'].astype(str).str.strip().eq('Committee Stage') &
              stages['stage_outcome'].astype(str).str.strip().str.casefold().eq('current')
          ].copy()
          if 'snapshot_date' in current_stage.columns:
              current_stage = current_stage.sort_values(['bill_id', 'snapshot_date', 'stage_date'])
              current_stage = current_stage.drop_duplicates(subset=['bill_id'], keep='last')

          rows = []
          for _, st in current_stage.iterrows():
              bill_id = str(st['bill_id'])
              b = bills[bills['bill_id'].astype(str).eq(bill_id)]
              if not b.empty:
                  if 'snapshot_date' in b.columns:
                      b = b.sort_values('snapshot_date')
                  br = b.iloc[-1].to_dict()
              else:
                  br = {}
              sp = sponsors[sponsors['bill_id'].astype(str).eq(bill_id)] if 'bill_id' in sponsors.columns else sponsors.iloc[0:0]
              bd = bill_debates[bill_debates['bill_id'].astype(str).eq(bill_id)] if 'bill_id' in bill_debates.columns else bill_debates.iloc[0:0]

              debate_pairs = set()
              debate_ids = set()
              for _, dr in bd.iterrows():
                  did = str(dr.get('debate_id') or '')
                  sid = str(dr.get('debate_section_id') or '')
                  if did:
                      debate_ids.add(did)
                      debate_pairs.add((did, sid))

              speech_count = 0
              if debate_ids and 'debate_id' in speeches.columns:
                  cand = speeches[speeches['debate_id'].astype(str).isin(debate_ids)]
                  if 'debate_section_id' in cand.columns:
                      cand = cand[cand.apply(lambda r: (str(r.get('debate_id') or ''), str(r.get('debate_section_id') or '')) in debate_pairs, axis=1)]
                  speech_count = int(len(cand))

              div_rows = divisions.iloc[0:0]
              if debate_ids and 'debate_id' in divisions.columns:
                  div_rows = divisions[divisions['debate_id'].astype(str).isin(debate_ids)].copy()
                  if 'debate_section_id' in div_rows.columns:
                      div_rows = div_rows[div_rows.apply(lambda r: (str(r.get('debate_id') or ''), str(r.get('debate_section_id') or '')) in debate_pairs, axis=1)]
              div_ids = set(div_rows['division_id'].astype(str)) if 'division_id' in div_rows.columns else set()
              vote_count = int(member_votes['division_id'].astype(str).isin(div_ids).sum()) if div_ids and 'division_id' in member_votes.columns else 0

              rows.append({
                  'bill_id': bill_id,
                  'bill_no': br.get('bill_no'),
                  'bill_year': br.get('bill_year'),
                  'title': br.get('title') or br.get('short_title'),
                  'status': br.get('status'),
                  'origin_house_name': br.get('origin_house_name'),
                  'introduced_date': br.get('introduced_date'),
                  'last_event_date': br.get('last_event_date'),
                  'stage_name': st.get('stage_name'),
                  'stage_date': st.get('stage_date'),
                  'stage_house_name': st.get('house_name'),
                  'stage_outcome': st.get('stage_outcome'),
                  'stage_snapshot_date': st.get('snapshot_date'),
                  'sponsor_rows': int(len(sp)),
                  'bill_debate_rows': int(len(bd)),
                  'linked_speech_rows': speech_count,
                  'linked_division_rows': int(len(div_rows)),
                  'linked_member_vote_rows': vote_count,
                  'linked_divisions': [
                      {k: r.get(k) for k in ['division_id','vote_id','division_date','chamber','subject','outcome','debate_id','debate_section_id','debate_show_as'] if k in div_rows.columns}
                      for _, r in div_rows.iterrows()
                  ],
                  'debates': [
                      {k: r.get(k) for k in ['debate_date','debate_show_as','debate_id','debate_section_id','chamber_name'] if k in bd.columns}
                      for _, r in bd.sort_values('debate_date').iterrows()
                  ] if not bd.empty and 'debate_date' in bd.columns else [],
                  'sponsors': [
                      {k: r.get(k) for k in ['sponsor_name','sponsor_role_name','is_primary','sponsor_order'] if k in sp.columns}
                      for _, r in sp.iterrows()
                  ],
              })

          payload = {
              'verified_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_batch_id': batch.batch_id,
              'source_pointer': batch.pointer,
              'batch_manifest_status': batch.manifest.get('status'),
              'lineage': lineage,
              'production_third_stage_count': len(rows),
              'production_current_committee_stage': rows,
              'table_columns': {name: list(frame.columns) for name, frame in frames.items()},
          }
          path = out_dir / 'production_third_stage_inventory.json'
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False, default=str), encoding='utf-8')
          print(json.dumps({'source_batch_id': batch.batch_id, 'count': len(rows), 'titles': [r['title'] for r in rows]}, indent=2, ensure_ascii=False))
          PY
      - name: Commit session inventory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add director/sessions/2026-10-10-bill-tracker-third-stage/production_third_stage_inventory.json
          git commit -m 'director: record Third Stage production inventory' || exit 0
          git push origin HEAD:sly/session/2026-10-10-bill-tracker-third-stage
