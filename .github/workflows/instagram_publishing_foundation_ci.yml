name: Instagram publishing foundation CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'publishing/**'
      - 'infra/publishing/**'
      - 'instagram_insights/**'
      - 'infra/instagram_insights/**'
      - 'instagram/factory/publication_handoff.py'
      - 'instagram/factory/render_pipeline.py'
      - 'instagram/caption_templates/**'
      - 'tests/test_instagram_publishing_foundation.py'
      - 'tests/test_instagram_publication_control.py'
      - 'tests/test_instagram_dynamodb_ledger.py'
      - 'tests/test_instagram_dynamodb_runtime.py'
      - 'tests/test_instagram_scheduler_execution.py'
      - 'tests/test_instagram_meta_publisher.py'
      - 'tests/test_instagram_meta_http_client.py'
      - 'tests/test_instagram_lambda_handler.py'
      - 'tests/test_instagram_s3_assets.py'
      - 'tests/test_instagram_canary.py'
      - 'tests/test_instagram_publication_handoff.py'
      - 'tests/test_instagram_insights_collector.py'
      - '.github/workflows/instagram_publish_standard.yml'
      - '.github/workflows/instagram_publishing_foundation_ci.yml'
      - '.github/workflows/deploy_instagram_publisher_lambda.yml'
      - '.github/workflows/instagram_insights_ci.yml'
      - '.github/workflows/instagram_insights_operations.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest boto3 pyyaml pillow cfn-lint

      - name: Compile publishing code and focused tests
        run: |
          python -m compileall publishing instagram_insights instagram/factory/publication_handoff.py instagram/factory/render_pipeline.py \
            tests/test_instagram_publishing_foundation.py \
            tests/test_instagram_publication_control.py \
            tests/test_instagram_dynamodb_ledger.py \
            tests/test_instagram_dynamodb_runtime.py \
            tests/test_instagram_scheduler_execution.py \
            tests/test_instagram_meta_publisher.py \
            tests/test_instagram_meta_http_client.py \
            tests/test_instagram_lambda_handler.py \
            tests/test_instagram_s3_assets.py \
            tests/test_instagram_canary.py \
            tests/test_instagram_publication_handoff.py \
            tests/test_instagram_insights_collector.py

      - name: Validate Instagram Insights CloudFormation
        run: cfn-lint infra/instagram_insights/*.yml

      - name: Run focused publication tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest \
            tests/test_instagram_publishing_foundation.py \
            tests/test_instagram_publication_control.py \
            tests/test_instagram_dynamodb_ledger.py \
            tests/test_instagram_dynamodb_runtime.py \
            tests/test_instagram_scheduler_execution.py \
            tests/test_instagram_meta_publisher.py \
            tests/test_instagram_meta_http_client.py \
            tests/test_instagram_lambda_handler.py \
            tests/test_instagram_s3_assets.py \
            tests/test_instagram_canary.py \
            tests/test_instagram_publication_handoff.py \
            tests/test_instagram_insights_collector.py \
            -vv --tb=long

      - name: Validate existing publishing CloudFormation
        run: cfn-lint infra/publishing/*.yml

      - name: Validate caption templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('instagram/caption_templates').glob('*.yml'):
              with path.open(encoding='utf-8') as handle:
                  value = yaml.safe_load(handle)
              assert isinstance(value, dict), path
              print(f'validated {path}')
          PY
